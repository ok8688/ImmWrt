# =====================================================================
# 🧪 [EXPERIMENTAL-SNAPSHOT-SEALED] - ImmortalWrt Master 實驗版母版
# =====================================================================
# 狀態：Experimental Track / Production-Sealed Candidate
# 哲學：跟隨 upstream master 滾動更新，作為 LTS 的技術預演區。
# 終極融合：
# 1. 繼承企業級即時串流 retry 除錯、串流日誌與包含考古 Artifacts 的全套 SRE 照護。
# 2. [Performance v2] 優化的 Runner 初始化與完整補齊的 APT 依賴鏈（含 master rolling 核心工具鏈、gperf、multilib 與 gnutls-dev），完整保留原生 toolcache。
# 3. [Performance v2] Immutable Cumulative Generation：每次 Run 產生唯一 Key 繼承快取增量。
# 4. 內建 ib v1.8 備份引擎，確保前沿版本依舊具備配置還原與跨版本逃生能力。
# 5. [SDC v2.0 Strict] 導入整份 Makefile 無損快照；任何可恢復異常皆觸發原始狀態回滾，遭拒時強制保留備份現場並中止 CI。寫入後強制校驗 Exact-One 配置。
# 6. [Strict No-Guess Resolution] SDC 僅接受 dumpinfo 解析出的「剛好一個」Exact Source；下載、驗證、寫入任一階段失敗即完整回滾並中止 CI。
# 7. [Strict Build] 保留 Parallel Build 失敗後的狀態，直接降級 -j1 V=s；以精確的 BUILD_RESULT/BUILD_MODE 雙變數回報並落盤 build-status.txt。
# 8. 顯式宣告 CONFIG_USE_APK=y；透過「Config 原生禁用 → Defconfig 收斂 → Post-Defconfig 正向/反向雙重審計 → 最終 Manifest 雙向審計」完成完整的狀態封鎖，徹底排拒 block-mount 等干擾項。
# 9. [Snapshot Native Track] 雙核心滿血火力全開：完整編譯並保留 Xray-core 與 Sing-box 核心，驗證上游最新分流元件穩定性。
# 10. [CCACHE 加速] 完全交予 OpenWrt 底層接管，搭配 ccache -z 歸零觀測與並行 Retry 機制。
# 11. [Node 24 Ready & Platform Longevity] 執行環境遷移至 ubuntu-24.04，採用 Node 24 相容的 Actions 版本，並透過 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 預先指定 Actions runtime 使用 Node 24，降低後續 Actions 遷移風險。
# 12. [Failure Archaeology] 獨立實作 if: always() 的考古現場日誌上傳（actions/upload-artifact@v6），包含隱藏配置與 SDC 備份現場，確保編譯成功 or 失敗皆可提取完整現場。
# 13. [Release Asset Self-Verification Closure] 在 release_assets 目錄內執行二次本地 sha256sum 閉環校驗，確保發布資產百分之百零瑕疵。
# =====================================================================

name: Build ImmWrt Master Snapshot V2

on:
  workflow_dispatch:
#  schedule:
#    - cron: '26 14 * * 0,2,4,6' # UTC 14:26 = HKT 22:26 (每週日、二、四、六)

concurrency:
  group: immwrt-build
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_COMPRESS: 1
  CCACHE_MAXSIZE: 2G
  CCACHE_SLOPPINESS: time_macros,file_macro

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Generate Metadata
        id: meta
        run: echo "date=$(date +%Y%m%d || echo unknown)" >> $GITHUB_OUTPUT

      - name: Inject SRE Core Utilities (Live Stream)
        run: |
          cat << 'EOF' > /tmp/sre_utils.sh
          #!/bin/bash
          set -o pipefail
          retry() {
            touch /tmp/retry_history.log /tmp/retry_debug.log
            local max=5; local delay=2; local n=1
            local cmd_name="$(printf '%q ' "$@")"
            
            while true; do
              if "$@" 2>&1 | tee -a /tmp/retry_debug.log; then
                echo "✅ Success!"
                break
              else
                if [[ $n -lt $max ]]; then
                  echo "⚠️ [FAIL] Attempt $n: $cmd_name" >> /tmp/retry_history.log
                  echo "⚠️ Failed! Retrying in $delay seconds..."
                  n=$((n + 1)); delay=$((delay * 2 + RANDOM % 3)); sleep $delay
                else
                  echo "❌ FATAL: Failed after $max retries: $cmd_name"
                  cat /tmp/retry_history.log
                  echo "--- LAST 300 LINES OF ERROR LOG ---"
                  tail -n 300 /tmp/retry_debug.log
                  return 1
                fi
              fi
            done
          }
          EOF
          chmod +x /tmp/sre_utils.sh
          
      - name: Init SRE Environment & Space Cleanup
        run: |
          set -euo pipefail
          echo "=== 💥 啟動空間清理 (釋放終極極限空間) ==="
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/share/swift \
            /usr/local/lib/node_modules \
            /usr/share/powershell \
            /usr/microsoft \
            /usr/local/share/edge_driver \
            /usr/local/.ghcup \
            /usr/share/miniconda \
            /opt/az \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/lib/heroku || true
            
          sudo apt-get clean
          
          echo "=== 🚀 部署依賴與內存裝甲 (含 Master Rolling 核心工具鏈、gperf & multilib) ==="
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses5-dev libssl-dev rsync unzip zlib1g-dev file wget jq golang-go ccache \
            cmake cpio curl gcc-multilib g++-multilib libelf-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libpython3-dev \
            libreadline-dev libtool lld llvm ninja-build patch pkgconf python3 \
            python3-pip python3-ply python3-pyelftools qemu-utils re2c scons \
            squashfs-tools subversion swig texinfo zstd \
            device-tree-compiler libncurses-dev libyaml-dev python3-docutils \
            gperf lib32gcc-s1 libc6-dev-i386 gnutls-dev
            
          echo "▶️ [Step] Deploying Swap Armor..."
          if ! swapon --show --noheadings | grep -q .; then
            sudo rm -f /swapfile
            sudo fallocate -l 4G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          else
            echo "Swap already exists, preserving it."
          fi
          swapon --show
          
          echo "=== 🧬 Deep ABI Fingerprint ===" > toolchain.info
          echo "Date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> toolchain.info
          uname -r >> toolchain.info
          gcc --version | head -n 1 >> toolchain.info
          ld --version | head -n 1 >> toolchain.info
          ldd --version | head -n 1 >> toolchain.info
          dpkg -s libc6 | grep Version >> toolchain.info
          go version >> toolchain.info || true
          
      - name: Clone & Setup Feeds
        run: |
          set -euo pipefail
          source /tmp/sre_utils.sh
          
          echo "▶️ [Step] Cloning ImmortalWrt Master Source..."
          retry bash -c 'rm -rf openwrt && timeout 20m git clone --single-branch --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt'
          cd openwrt
          
          echo "▶️ [Step] Updating base feeds..."
          retry timeout 35m ./scripts/feeds update -a
          
          # ✅ 物理防護 - 徹底切斷 upstream 舊版 PassWall 生態供應鏈
          PASSWALL_UPSTREAM_PKGS="
          xray-core
          v2ray-geodata
          sing-box
          chinadns-ng
          dns2socks
          hysteria
          ipt2socks
          microsocks
          naiveproxy
          shadowsocks-rust
          shadowsocksr-libev
          simple-obfs
          tcping
          v2ray-plugin
          xray-plugin
          geoview
          shadow-tls
          "
          for pkg in $PASSWALL_UPSTREAM_PKGS; do
            ./scripts/feeds uninstall "$pkg" || true
          done
          ./scripts/feeds uninstall \
            luci-app-passwall \
            luci-app-fstab \
            luci-app-plugins || true
            
          for pkg in $PASSWALL_UPSTREAM_PKGS; do
            rm -rf \
              "feeds/packages/net/$pkg" \
              "package/feeds/packages/$pkg"
          done
          rm -rf \
            feeds/luci/applications/luci-app-passwall \
            feeds/luci/applications/luci-app-fstab \
            feeds/luci/applications/luci-app-plugins \
            package/feeds/luci/luci-app-passwall \
            package/feeds/luci/luci-app-fstab \
            package/feeds/luci/luci-app-plugins
          
          echo "▶️ [Step] Cloning Passwall ecosystem (Latest Upstream with Timeout)..."
          retry bash -c 'timeout 15m git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/openwrt-passwall-packages'
          retry bash -c 'timeout 15m git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall.git package/openwrt-passwall'
            
          echo "▶️ [Step] Installing feeds..."
          retry bash -c 'set -o pipefail; timeout 35m ./scripts/feeds install -a -f'

      - name: Audit Core Sources Exist & Unique
        run: |
          set -euo pipefail
          cd openwrt
          echo "=== 🔍 PassWall Ecosystem Source Isolation Audit ==="
          for pkg in \
            xray-core \
            v2ray-geodata \
            sing-box \
            chinadns-ng \
            dns2socks \
            hysteria \
            ipt2socks \
            microsocks \
            naiveproxy \
            shadowsocks-rust \
            shadowsocksr-libev \
            simple-obfs \
            tcping \
            v2ray-plugin \
            xray-plugin \
            geoview \
            shadow-tls
          do
            upstream_path="feeds/packages/net/$pkg"
            if [ -e "$upstream_path" ]; then
              echo "❌ UPSTREAM DUPLICATE REMAINS: $pkg"
              exit 1
            fi
          done
          
          for f in \
            package/openwrt-passwall-packages/xray-core/Makefile \
            package/openwrt-passwall-packages/sing-box/Makefile
          do
            if [ ! -f "$f" ]; then
              echo "❌ REQUIRED CORE SOURCE MISSING: $f"
              exit 1
            fi
          done
          
          XRAY_COUNT="$(find feeds package -path '*/xray-core/Makefile' -type f | wc -l)"
          SINGBOX_COUNT="$(find feeds package -path '*/sing-box/Makefile' -type f | wc -l)"
          echo "Xray-core Makefiles : $XRAY_COUNT"
          echo "Sing-box Makefiles  : $SINGBOX_COUNT"
          if [ "$XRAY_COUNT" -ne 1 ]; then
            echo "❌ Expected exactly one xray-core source, got $XRAY_COUNT"
            exit 1
          fi
          if [ "$SINGBOX_COUNT" -ne 1 ]; then
            echo "❌ Expected exactly one sing-box source, got $SINGBOX_COUNT"
            exit 1
          fi
          echo "✅ PassWall upstream ecosystem isolation audit passed"

      - name: Generate Source / Feed provenance snapshot
        run: |
          set -euo pipefail
          cd openwrt
          {
            echo "=== 🧬 COMPONENT COMMIT ==="
            echo "ImmortalWrt Commit: $(git rev-parse HEAD)"
            echo "PassWall Commit: $(git -C package/openwrt-passwall rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "PassWall Packages Commit: $(git -C package/openwrt-passwall-packages rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "=== 🧬 FEEDS LIST ==="
            ./scripts/feeds list -f | sort
            echo "=== 🧬 REPOS STATUS ==="
            find package -maxdepth 2 -name .git -print0 | while IFS= read -r -d '' gitdir; do
              repo=$(dirname "$gitdir")
              echo "$(git -C "$repo" remote get-url origin 2>/dev/null):$(git -C "$repo" rev-parse HEAD)"
            done | sort
          } > ../feeds.snapshot.txt

      - name: Generate Cache Variables
        id: var
        run: |
          echo "dl_key=dl-snapshot-${{ hashFiles('feeds.snapshot.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}" >> $GITHUB_OUTPUT
          echo "ccache_key=ccache-snapshot-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" >> $GITHUB_OUTPUT

      - name: Restore Cache (dl)
        uses: actions/cache/restore@v5
        with:
          path: |
            openwrt/dl
          key: ${{ steps.var.outputs.dl_key }}
          restore-keys: |
            dl-snapshot-${{ hashFiles('feeds.snapshot.txt') }}-
            dl-snapshot-
            
      - name: Restore Cache (ccache)
        uses: actions/cache/restore@v5
        with:
          path: ~/.ccache
          key: ${{ steps.var.outputs.ccache_key }}
          restore-keys: |
            ccache-snapshot-

      - name: Apply Drift Control & Patches
        run: |
          set -euo pipefail
          cd openwrt
          
          # =====================================================
          # 🔧 Rust Host Build Fix (CI LLVM Artifact 404)
          # =====================================================
          RUST_MAKEFILE="feeds/packages/lang/rust/Makefile"

          if [ ! -f "$RUST_MAKEFILE" ]; then
            echo "❌ FATAL: Rust Makefile not found: $RUST_MAKEFILE"
            exit 1
          fi

          sed -i -E \
            's/--set=llvm\.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/g' \
            "$RUST_MAKEFILE"

          if grep -Eq -- '--set=llvm\.download-ci-llvm=true' "$RUST_MAKEFILE"; then
            echo "❌ FATAL: Rust download-ci-llvm=true still remains"
            exit 1
          fi

          if ! grep -Eq -- '--set=llvm\.download-ci-llvm=false' "$RUST_MAKEFILE"; then
            echo "❌ FATAL: Rust download-ci-llvm=false patch was not applied"
            exit 1
          fi

          echo "✅ Rust host build patch applied: download-ci-llvm=false"
          # =====================================================

          # 全域精準破壞前端選單殘留節點（以特徵篩選，避免無關套件的上游語法缺陷導致解析中斷）
          find feeds package -path "*/usr/share/luci/menu.d/*.json" -type f | while read -r f; do
            if grep -Eq '"admin/(system/mounts|services/mounts|services/plugins)"' "$f"; then
              echo "🔧 Sanitizing leftover menu nodes in: $f"
              if jq 'del(."admin/system/mounts", ."admin/services/mounts", ."admin/services/plugins")' "$f" > "$f.tmp"; then
                mv "$f.tmp" "$f"
              else
                echo "❌ FATAL: Failed to parse or sanitize valid target JSON in $f"
                rm -f "$f.tmp"
                exit 1
              fi
            fi
          done

      - name: Inject ImmWrt Backup Tool (ib v1.8)
        run: |
          set -e
          mkdir -p openwrt/package/base-files/files/usr/bin
          cat << 'IB_SCRIPT' > openwrt/package/base-files/files/usr/bin/ib
          #!/bin/sh

          VERSION="1.8"
          readonly VERSION

          BACKUP_DIR="${IBB_BACKUP_DIR:-/root}"
          readonly BACKUP_DIR

          BACKUP="$BACKUP_DIR/immwrt-backup-latest.tar.gz"
          readonly BACKUP

          WORK="/tmp/ib-work"
          readonly WORK

          SAFETY="/tmp/ib-safety"
          readonly SAFETY

          VERIFY_TEST="/tmp/ib-verify-test"
          readonly VERIFY_TEST


          # ============================================================
          # Backup Scope
          # ============================================================

          REQUIRED_FILES="
          /etc/config/ddns
          /etc/config/dhcp
          /etc/config/firewall
          /etc/config/luci
          /etc/config/network
          /etc/config/passwall
          /etc/config/passwall_server
          /etc/config/smartdns
          /etc/config/system
          /etc/config/upnpd
          /etc/crontabs/root
          "
          readonly REQUIRED_FILES

          OPTIONAL_FILES="
          /etc/config/argon
          /usr/share/passwall/rules/direct_host
          /usr/share/passwall/rules/direct_ip
          /usr/share/passwall/rules/proxy_host
          /usr/share/passwall/rules/proxy_ip
          /www/luci-static/argon/css/dark.css
          "
          readonly OPTIONAL_FILES

          # Decoupled: Configuration backup does not mandate package installation on restore
          MIN_REQUIRED_PACKAGES=""
          readonly MIN_REQUIRED_PACKAGES


          # ============================================================
          # Core Utilities & Safety Boundaries
          # ============================================================

          fail()
          {
              printf "FAILED: %s\n" "$1" >&2
              exit "${2:-1}"
          }


          safe_rm()
          {
              case "$1" in
                  "$WORK"|"$SAFETY"|"$VERIFY_TEST")
                      rm -rf -- "$1"
                      ;;
                  *)
                      fail "safe_rm aborted: illegal path $1" 1
                      ;;
              esac
          }


          check_root()
          {
              [ "$(id -u)" = "0" ] || fail "root required" 1
          }


          #
          # Exact restore whitelist.
          #
          validate_path()
          {
              case "$1" in
                  /etc/config/ddns|\
                  /etc/config/dhcp|\
                  /etc/config/firewall|\
                  /etc/config/luci|\
                  /etc/config/network|\
                  /etc/config/passwall|\
                  /etc/config/passwall_server|\
                  /etc/config/smartdns|\
                  /etc/config/system|\
                  /etc/config/upnpd|\
                  /etc/crontabs/root|\
                  /etc/config/argon|\
                  /usr/share/passwall/rules/direct_host|\
                  /usr/share/passwall/rules/direct_ip|\
                  /usr/share/passwall/rules/proxy_host|\
                  /usr/share/passwall/rules/proxy_ip|\
                  /www/luci-static/argon/css/dark.css)
                      return 0
                      ;;
                  *)
                      return 1
                      ;;
              esac
          }


          usage()
          {
              printf \
          "ImmWrt Backup Tool v%s
          Usage:
            ib {b|backup}
            ib {r|restore}
            ib {v|verify}
            ib {i|info}
            ib {ver|version}
          \n" "$VERSION"

              exit 2
          }


          # ============================================================
          # Error Boundaries
          # ============================================================

          fail_backup()
          {
              rm -f -- "$BACKUP.tmp"
              safe_rm "$WORK"
              safe_rm "$VERIFY_TEST"
              fail "$1" "${2:-1}"
          }


          fail_verify()
          {
              safe_rm "$WORK"
              fail "$1" "${2:-1}"
          }


          fail_restore_preflight()
          {
              safe_rm "$WORK"
              safe_rm "$SAFETY"
              fail "$1" "${2:-1}"
          }


          # ============================================================
          # Signal Traps
          # ============================================================

          trap_backup()
          {
              printf "\n[!] Backup interrupted. Cleaning up...\n"

              rm -f -- "$BACKUP.tmp"

              safe_rm "$WORK"
              safe_rm "$VERIFY_TEST"

              exit 130
          }


          trap_restore()
          {
              printf "\n[!] Restore interrupted! Initiating emergency rollback...\n"

              if [ -f "$SAFETY/state.txt" ]; then

                  if restore_safety_back; then
                      printf "Rollback completed successfully.\n"

                      safe_rm "$SAFETY"
                      safe_rm "$WORK"
                  else
                      printf \
          "CRITICAL: Rollback failed!
          CRITICAL: Safety snapshot preserved at %s
          " "$SAFETY" >&2
                  fi

              else

                  printf \
          "INFO: Restore interrupted before configuration replacement.
          "

                  safe_rm "$SAFETY"
                  safe_rm "$WORK"
              fi

              exit 130
          }


          # ============================================================
          # Hardened Archive Validation
          # ============================================================

          verify_archive_members()
          {
              local archive="$1"
              local listing
              local line
              local type_char
              local member

              listing="$(tar -tvzf "$archive" 2>/dev/null)" || \
                  fail "Unable to inspect archive members: $archive" 5

              while IFS= read -r line; do

                  [ -n "$line" ] || continue

                  type_char="$(printf '%s' "$line" | cut -c1)"
                  member="$(printf '%s' "$line" | awk '{print $NF}')"

                  case "$type_char" in
                      -|d)
                          ;;
                      *)
                          fail \
          "Security violation: Unsafe archive entry type ($type_char): $member" \
                              5
                          ;;
                  esac

                  case "$member" in
                      files|files/*|manifest.txt|checksum.sha256|packages.txt|firmware.info)
                          ;;
                      *)
                          fail \
          "Security violation: Archive member outside whitelist: $member" \
                              5
                          ;;
                  esac

                  case "$member" in
                      /*|../*|*/../*|*/..)
                          fail \
          "Security violation: Archive traversal detected: $member" \
                              5
                          ;;
                  esac

              done <<ARCHIVE_LISTING
          $listing
          ARCHIVE_LISTING
          }


          # ============================================================
          # Archive ↔ Manifest Exact Verification
          # ============================================================

          verify_archive_exact()
          {
              local archive="$1"
              local listing
              local member
              local path

              listing="$(tar -tzf "$archive" 2>/dev/null)" || \
                  fail "Unable to enumerate archive members" 5

              while IFS= read -r member; do

                  [ -n "$member" ] || continue

                  case "$member" in

                      files/|files/*/)
                          # Ignore directory entries generated by tar
                          ;;

                      files/*)

                          path="/${member#files/}"

                          grep -Fqx "$path" "$WORK/manifest.parsed" || \
                              fail \
          "Security violation: Unmanifested file in archive: $member" \
                                  5
                          ;;

                      *)
                          # Already covered by verify_archive_members()
                          ;;

                  esac

              done <<ARCHIVE_LISTING
          $listing
          ARCHIVE_LISTING
          }


          # ============================================================
          # Package / Environment Support
          # ============================================================

          package_installed()
          {
              local pkg="$1"

              if command -v apk >/dev/null 2>&1; then
                  apk info -e "$pkg" >/dev/null 2>&1
                  return $?
              fi

              if command -v opkg >/dev/null 2>&1; then
                  opkg status "$pkg" 2>/dev/null |
                      grep -q '^Status: install'
                  return $?
              fi

              return 1
          }


          # ============================================================
          # Firmware Fingerprint
          # ============================================================

          create_firmware_info()
          {
              local rel="/etc/openwrt_release"

              {
                  printf "IBB-Version: %s\n" "$VERSION"

                  printf "Architecture: %s\n" \
                      "$(uname -m)"

                  printf "Distribution: %s\n" \
                      "$(grep DISTRIB_ID "$rel" 2>/dev/null |
                          cut -d= -f2 |
                          tr -d "'" ||
                          echo "Unknown")"

                  printf "Version: %s\n" \
                      "$(grep DISTRIB_RELEASE "$rel" 2>/dev/null |
                          cut -d= -f2 |
                          tr -d "'" ||
                          echo "Unknown")"

                  printf "Revision: %s\n" \
                      "$(grep DISTRIB_REVISION "$rel" 2>/dev/null |
                          cut -d= -f2 |
                          tr -d "'" ||
                          echo "Unknown")"

                  printf "Kernel: %s\n" \
                      "$(uname -r)"

                  printf "Date: %s\n" \
                      "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

              } > "$1"
          }


          verify_firmware_info()
          {
              local backup_arch

              [ -f "firmware.info" ] || return 0

              backup_arch="$(
                  grep '^Architecture:' firmware.info |
                  cut -d' ' -f2-
              )"

              [ "$backup_arch" = "$(uname -m)" ] || \
                  fail_restore_preflight \
          "Architecture mismatch (Backup: $backup_arch, System: $(uname -m))" \
                      8
          }


          # ============================================================
          # Package Compatibility
          # ============================================================

          verify_packages()
          {
              local pkg

              for pkg in $MIN_REQUIRED_PACKAGES; do

                  package_installed "$pkg" || \
                      fail_restore_preflight \
          "Missing required dependency: $pkg" \
                          8

              done

              [ -f "packages.txt" ] || return 0

              awk '
                  /\[REQUIRED\]/ {
                      m=1
                      next
                  }

                  /^\[/ {
                      m=0
                  }

                  m && NF {
                      print $1
                  }
              ' packages.txt |
              while IFS= read -r pkg; do

                  package_installed "$pkg" || \
                      printf \
          "  [WARN] Missing historical package: %s\n" \
                          "$pkg"

              done
          }


          # ============================================================
          # Manifest Parsing
          # ============================================================

          read_manifest()
          {
              awk '
                  /^[[:space:]]*#/ {
                      next
                  }

                  NF == 0 {
                      next
                  }

                  $1 ~ /^\// {
                      print $1
                  }
              ' manifest.txt > "$WORK/manifest.raw" || \
                  fail_restore_preflight "Manifest parse error" 5

              sort "$WORK/manifest.raw" |
                  uniq -d > "$WORK/dups"

              if [ -s "$WORK/dups" ]; then
                  fail_restore_preflight \
          "Manifest duplicate entries: $(cat "$WORK/dups")" \
                      5
              fi

              sort -u "$WORK/manifest.raw" > "$WORK/manifest.parsed"

              [ -s "$WORK/manifest.parsed" ] || \
                  fail_restore_preflight "Manifest empty" 5
          }


          # ============================================================
          # Manifest Security Verification
          # ============================================================

          verify_manifest()
          {
              local f

              while IFS= read -r f; do

                  validate_path "$f" || \
                      fail_restore_preflight \
          "Path outside restore whitelist: $f" \
                          5

                  [ -f "files$f" ] || \
                      fail_restore_preflight \
          "Missing archive file for manifest entry: $f" \
                          5

                  done < "$WORK/manifest.parsed"
          }


          # ============================================================
          # Safety Snapshot
          # ============================================================

          restore_safety()
          {
              local f

              safe_rm "$SAFETY"

              mkdir -p "$SAFETY/files" || \
                  fail_restore_preflight "Safety directory creation failed" 1

              : > "$SAFETY/state.txt" || \
                  fail_restore_preflight "Safety state creation failed" 1

              while IFS= read -r f; do

                  if [ -f "$f" ]; then

                      mkdir -p "$(dirname "$SAFETY/files$f")" || \
                          fail_restore_preflight \
          "Safety directory creation failed: $f" \
                              1

                      cp -p "$f" "$SAFETY/files$f" || \
                          fail_restore_preflight \
          "Safety snapshot failed: $f" \
                              1

                      printf "EXIST %s\n" "$f" \
                          >> "$SAFETY/state.txt"

                  elif [ -e "$f" ]; then

                      fail_restore_preflight \
          "INVALID STATE: $f is not a regular file" \
                          7

                  else

                      printf "MISSING %s\n" "$f" \
                          >> "$SAFETY/state.txt"

                  fi

              done < "$WORK/manifest.parsed"
          }


          # ============================================================
          # Emergency Rollback
          # ============================================================

          restore_safety_back()
          {
              local status=0
              local state
              local f
              local tmp

              [ -f "$SAFETY/state.txt" ] || return 1

              while IFS=' ' read -r state f; do

                  case "$state" in

                      EXIST)

                          if [ ! -f "$SAFETY/files$f" ]; then

                              printf \
          "CRITICAL: Safety snapshot missing for %s\n" \
                                  "$f" >&2

                              status=1
                              continue
                          fi

                          mkdir -p "$(dirname "$f")" || {

                              printf \
          "CRITICAL: Rollback directory creation failed for %s\n" \
                                  "$f" >&2

                              status=1
                              continue
                          }

                          tmp="${f}.ib-tmp"

                          rm -f "$tmp"

                          if ! cp -p "$SAFETY/files$f" "$tmp" ||
                               ! mv -f "$tmp" "$f"; then

                              printf \
          "CRITICAL: Rollback failed for %s\n" \
                                  "$f" >&2

                              rm -f "$tmp"

                              status=1
                          fi
                          ;;

                      MISSING)

                      if [ -e "$f" ] && ! rm -f "$f"; then

                              printf \
          "CRITICAL: Failed to remove restored file %s\n" \
                                  "$f" >&2

                              status=1
                          fi
                          ;;

                      *)
                          printf \
          "CRITICAL: Invalid safety state: %s %s\n" \
                              "$state" "$f" >&2

                          status=1
                          ;;

                  esac

              done < "$SAFETY/state.txt"

              [ "$status" -eq 0 ]
          }


          # ============================================================
          # Post-Restore Verification
          # ============================================================

          verify_restored()
          {
              local f
              local hash_src
              local hash_dst

              while IFS= read -r f; do

                  if [ ! -f "$f" ]; then

                      printf \
          "ERROR: Restored file missing: %s\n" \
                          "$f" >&2

                      return 1
                  fi

                  hash_src="$(
                      sha256sum "files$f" |
                      cut -d' ' -f1
                  )" || return 1

                  hash_dst="$(
                      sha256sum "$f" |
                      cut -d' ' -f1
                  )" || return 1

                  if [ "$hash_src" != "$hash_dst" ]; then

                      printf \
          "ERROR: Restored checksum mismatch: %s\n" \
                          "$f" >&2

                      return 1
                  fi

              done < "$WORK/manifest.parsed"

              return 0
          }


          # ============================================================
          # Target File Collection
          # ============================================================

          get_target_files()
          {
              local list=""
              local f

              for f in $REQUIRED_FILES; do

                  [ -f "$f" ] || \
                      fail "Missing REQUIRED file: $f" 3

                  list="$list $f"

              done

              for f in $OPTIONAL_FILES; do

                  if [ -f "$f" ]; then

                      list="$list $f"

                  else

                      printf \
          "INFO: Optional file missing, skipping: %s\n" \
                          "$f" >&2

                  fi

              done

              echo "$list"
          }


          # ============================================================
          # BACKUP
          # ============================================================

          backup()
          {
              trap trap_backup INT TERM HUP

              local target_files
              local count=0
              local f

              target_files="$(get_target_files)"

              safe_rm "$WORK"
              safe_rm "$VERIFY_TEST"

              rm -f -- "$BACKUP.tmp"

              mkdir -p "$WORK/files" || \
                  fail_backup "Workspace creation failed" 1

              for f in $target_files; do

                  mkdir -p "$(dirname "$WORK/files$f")" || \
                      fail_backup \
          "Directory creation failed: $f" \
                          1

                  cp -p "$f" "$WORK/files$f" || \
                      fail_backup \
          "Copy failed: $f" \
                          1

                  count=$((count + 1))

              done

              cd "$WORK" || \
                  fail_backup "Workspace cd failed" 1


              {
                  printf "# ImmWrt Backup Manifest\n"
                  printf "# Tool-Version: %s\n" "$VERSION"
                  printf "# Date: %s\n" \
                      "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

                  for f in $target_files; do
                      printf "%s\n" "$f"
                  done

              } > manifest.txt || \
                  fail_backup "Manifest creation failed" 1


              : > checksum.sha256 || \
                  fail_backup "Checksum file creation failed" 4

              for f in $target_files; do

                  sha256sum "files$f" >> checksum.sha256 || \
                      fail_backup \
          "Checksum calculation failed: $f" \
                          4

              done


              {
                  printf "[REQUIRED]\n"

                  for f in $MIN_REQUIRED_PACKAGES; do
                      printf "%s\n" "$f"
                  done

              } > packages.txt || \
                  fail_backup "Package metadata creation failed" 1


              create_firmware_info "firmware.info"


              tar -czf "$BACKUP.tmp" \
                  files \
                  manifest.txt \
                  checksum.sha256 \
                  packages.txt \
                  firmware.info || \
                  fail_backup "Tar compression failed" 1


              gzip -t "$BACKUP.tmp" || \
                  fail_backup \
          "Gzip integrity test failed" \
                      4

              tar -tzf "$BACKUP.tmp" >/dev/null || \
                  fail_backup \
          "Tar header integrity test failed" \
                      4


              mkdir -p "$VERIFY_TEST" || \
                  fail_backup \
          "Verification workspace creation failed" \
                      4

              tar -xzf "$BACKUP.tmp" -C "$VERIFY_TEST" || \
                  fail_backup \
          "Secondary extraction failed" \
                      4

              (
                  cd "$VERIFY_TEST" || exit 1

                  sha256sum -c checksum.sha256 \
                      >/dev/null 2>&1
              ) || {

                  safe_rm "$VERIFY_TEST"

                  fail_backup \
          "Secondary extraction checksum verification failed" \
                      4
              }

              safe_rm "$VERIFY_TEST"

              verify_archive_members "$BACKUP.tmp" || \
                  fail_backup \
          "Archive member security verification failed" \
                      5

              mv "$BACKUP.tmp" "$BACKUP" || \
                  fail_backup \
          "Atomic replacement of backup failed" \
                      1

              safe_rm "$WORK"

              trap - INT TERM HUP

              printf \
          "\nBackup completed successfully. (%d files)\n" \
                  "$count"
          }


          # ============================================================
          # RESTORE
          # ============================================================

          restore()
          {
              local count=0
              local f
              local tmp

              [ -f "$BACKUP" ] || \
                  fail \
          "Backup not found at $BACKUP" \
                      5

              gzip -t "$BACKUP" || \
                  fail_restore_preflight \
          "Archive gzip corrupted" \
                      5

              verify_archive_members "$BACKUP" || \
                  fail_restore_preflight \
          "Archive member security verification failed" \
                      5

              safe_rm "$WORK"

              mkdir -p "$WORK" || \
                  fail_restore_preflight \
          "Workspace creation failed" \
                      5

              tar -xzf "$BACKUP" -C "$WORK" || \
                  fail_restore_preflight \
          "Archive extraction failed" \
                      5

              cd "$WORK" || \
                  fail_restore_preflight \
          "Workspace cd failed" \
                      5

              [ -f "manifest.txt" ] || \
                  fail_restore_preflight \
          "Manifest missing" \
                      5

              [ -f "checksum.sha256" ] || \
                  fail_restore_preflight \
          "Checksum manifest missing" \
                      5

              read_manifest

              verify_manifest

              verify_archive_exact "$BACKUP" || \
                  fail_restore_preflight \
          "Archive exact verification failed" \
                      5

              sha256sum -c checksum.sha256 \
                  >/dev/null 2>&1 || \
                  fail_restore_preflight \
          "Archive checksum verification failed" \
                      5

              verify_firmware_info

              verify_packages

              restore_safety

              trap trap_restore INT TERM HUP

              while IFS= read -r f; do

                  mkdir -p "$(dirname "$f")" || {

                      if restore_safety_back; then

                          fail \
          "Directory creation failed for $f. Rollback successful." \
                              6

                      else

                          printf \
          "CRITICAL: Rollback failed!\n" >&2

                          printf \
          "CRITICAL: Safety snapshot preserved at %s\n" \
                              "$SAFETY" >&2

                          exit 6
                      fi
                  }

                  tmp="${f}.ib-tmp"

                  rm -f "$tmp"

                  if ! cp -p "files$f" "$tmp" ||
                       ! mv -f "$tmp" "$f"; then

                      rm -f "$tmp"

                      if restore_safety_back; then

                          fail \
          "Atomic replacement failed for $f. Rollback successful." \
                              6

                      else

                          printf \
          "CRITICAL: Atomic replacement and rollback failed!\n" \
                              >&2

                          printf \
          "CRITICAL: Safety snapshot preserved at %s\n" \
                              "$SAFETY" >&2

                          exit 6
                      fi
                  fi

                  count=$((count + 1))

              done < "$WORK/manifest.parsed"

              if ! verify_restored; then

                  if restore_safety_back; then

                      fail \
          "Post-restore verification failed. Rollback successful." \
                          6

                  else

                      printf \
          "CRITICAL: Post-restore verification AND rollback failed!\n" \
                          >&2

                          printf \
          "CRITICAL: Safety snapshot preserved at %s\n" \
                              "$SAFETY" >&2

                          exit 6
                  fi
              fi

              safe_rm "$SAFETY"
              safe_rm "$WORK"

              trap - INT TERM HUP

              printf \
          "Restore completed successfully. (%d files)\n" \
                  "$count"

              exit 0
          }


          # ============================================================
          # VERIFY
          # ============================================================

          verify_cmd()
          {
              [ -f "$BACKUP" ] || \
                  fail \
          "Backup not found at $BACKUP" \
                      5

              gzip -t "$BACKUP" || \
                  fail \
          "Archive gzip corrupted" \
                      5

              verify_archive_members "$BACKUP" || \
                  fail \
          "Archive member security verification failed" \
                      5

              tar -tzf "$BACKUP" >/dev/null || \
                  fail \
          "Archive tar headers corrupted" \
                      4

              safe_rm "$WORK"

              mkdir -p "$WORK" || \
                  fail_verify \
          "Verification workspace creation failed" \
                      5

              tar -xzf "$BACKUP" -C "$WORK" || \
                  fail_verify \
          "Archive extraction failed" \
                      5

              cd "$WORK" || \
                  fail_verify \
          "Workspace cd failed" \
                      5

              [ -f "manifest.txt" ] || \
                  fail_verify \
          "Manifest missing" \
                      5

              [ -f "checksum.sha256" ] || \
                  fail_verify \
          "Checksum manifest missing" \
                      5

              read_manifest

              verify_manifest

              verify_archive_exact "$BACKUP" || \
                  fail_verify \
          "Archive exact verification failed" \
                      5

              sha256sum -c checksum.sha256 \
                  >/dev/null 2>&1 || \
                  fail_verify \
          "Checksum verification failed" \
                      5

              verify_firmware_info

              verify_packages

              safe_rm "$WORK"

              printf \
          "VERIFY SUCCESS: Archive is intact, complete, and compatible.\n"

              exit 0
          }


          # ============================================================
          # INFO
          # ============================================================

          info_cmd()
          {
              [ -f "$BACKUP" ] || \
                  fail \
          "Backup not found at $BACKUP" \
                      5

              gzip -t "$BACKUP" || \
                  fail \
          "Archive gzip corrupted" \
                      5

              verify_archive_members "$BACKUP" || \
                  fail \
          "Archive member security verification failed" \
                      5

              safe_rm "$WORK"

              mkdir -p "$WORK" || \
                  fail \
          "Info workspace creation failed" \
                      5

              tar -xzf "$BACKUP" \
                  -C "$WORK" \
                  firmware.info \
                  2>/dev/null

              if [ -f "$WORK/firmware.info" ]; then

                  cat "$WORK/firmware.info"

              else

                  printf \
          "Firmware Info: Legacy archive format (no firmware.info)\n"

              fi

              safe_rm "$WORK"

              exit 0
          }


          # ============================================================
          # CLI Dispatcher
          # ============================================================

          case "${1:-}" in

              b|backup)

                  check_root
                  backup
                  ;;

              r|restore)

                  check_root
                  restore
                  ;;

              v|verify)

                  check_root
                  verify_cmd
                  ;;

              i|info)

                  info_cmd
                  ;;

              ver|version)

                  printf "ib v%s\n" "$VERSION"
                  exit 0
                  ;;

              *)

                  usage
                  ;;

          esac
          IB_SCRIPT
          chmod 755 openwrt/package/base-files/files/usr/bin/ib
            
      - name: Generate Core Config
        run: |
          set -euo pipefail
          cd openwrt
          {
