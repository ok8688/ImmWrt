          grep -iE "CONFIG_PACKAGE_(kmod-wireguard|wireguard-tools|luci-proto-wireguard|qrencode)" .config || true
          
          make defconfig && ./scripts/diffconfig.sh > ../logs_diffconfig.txt

          # =====================================================
          # 🔒 Stable Drift Control v2.0 (Strict Exact-One & Resilient Rollback)
          # =====================================================
          sync_hash() {
            local name="$1"
            local makefile="$2"
            
            if [ ! -f "$makefile" ]; then
              echo "❌ FATAL: $name: Makefile missing at $makefile"
              return 1
            fi
            
            local pkg_dir="$(dirname "$makefile")"
            echo "🔒 [SDC v2.0] Native source resolution: $name"
            
            cp -a "$makefile" "${makefile}.sdc-backup" || {
              echo "❌ FATAL: Failed to create Makefile backup for $name"
              return 1
            }
            
            restore_original_makefile() {
              echo "⚠️ $name: Restoring original Makefile state"
              if cp -a "${makefile}.sdc-backup" "$makefile"; then
                rm -f "${makefile}.sdc-backup"
                echo "✅ $name: Original Makefile restored successfully"
                return 0
              else
                echo "❌ CRITICAL: Failed to restore original Makefile for $name" >&2
                echo "❌ CRITICAL: Preserving backup: ${makefile}.sdc-backup" >&2
                return 1
              fi
            }
            
            if grep -Eq '^[[:space:]]*PKG_HASH[[:space:]]*(:=|\?=|=)' "$makefile"; then
              if ! sed -i -E 's/^[[:space:]]*PKG_HASH[[:space:]]*(:=|\?=|=).*/PKG_HASH:=skip/' "$makefile"; then
                echo "❌ FATAL: Failed to neutralize PKG_HASH for $name"
                if ! restore_original_makefile; then exit 1; fi
                return 1
              fi
            else
              if ! printf '\nPKG_HASH:=skip\n' >> "$makefile"; then
                echo "❌ FATAL: Failed to append PKG_HASH neutralizer for $name"
                if ! restore_original_makefile; then exit 1; fi
                return 1
              fi
            fi

            if grep -Eq '^[[:space:]]*PKG_MIRROR_HASH[[:space:]]*(:=|\?=|=)' "$makefile"; then
              if ! sed -i -E 's/^[[:space:]]*PKG_MIRROR_HASH[[:space:]]*(:=|\?=|=).*/PKG_MIRROR_HASH:=skip/' "$makefile"; then
                echo "❌ FATAL: Failed to neutralize PKG_MIRROR_HASH for $name"
                if ! restore_original_makefile; then exit 1; fi
                return 1
              fi
            fi
            
            # Strict Exact-One Source resolution
            local source_lines=""

            source_lines="$(make --no-print-directory -s -f "$makefile" TOPDIR="$PWD" DUMP=1 dumpinfo 2>"/tmp/sdc-${name}-dumpinfo.log" \
              | sed -n 's/^Source: //p' \
              | sed 's/\r$//' \
              | sed 's/^[[:space:]]*//' \
              | sed 's/[[:space:]]*$//')" || true
            
            local source_count
            source_count="$(printf '%s\n' "$source_lines" | sed '/^$/d' | wc -l)"
            if [ "$source_count" -ne 1 ]; then
              echo "❌ FATAL: dumpinfo must resolve exactly one Source for $name, got $source_count"
              cat "/tmp/sdc-${name}-dumpinfo.log" 2>/dev/null || true
              if ! restore_original_makefile; then exit 1; fi
              return 1
            fi
            
            local pkg_source="$source_lines"
            pkg_source="$(basename -- "$pkg_source")"
            echo "🧹 [SDC v2.0] Purging stale dl cache for exact source: $pkg_source"
            rm -f "dl/$pkg_source"
            
            local DOWNLOAD_OK=0
            if make "${pkg_dir}/download" V=s >"/tmp/sdc-${name}-download.log" 2>&1; then
              DOWNLOAD_OK=1
              echo "✅ $name: download stage completed"
            else
              echo "❌ FATAL: download stage failed for $name"
              tail -n 80 "/tmp/sdc-${name}-download.log" || true
              if ! restore_original_makefile; then exit 1; fi
              return 1
            fi
            
            local FILE=""
            if [ "$DOWNLOAD_OK" -eq 1 ] && [ -f "dl/$pkg_source" ]; then
              FILE="dl/$pkg_source"
            else
              echo "❌ FATAL: Exact artifact dl/$pkg_source missing after successful download."
              if ! restore_original_makefile; then exit 1; fi
              return 1
            fi
            
            local NEW_HASH=""
            NEW_HASH="$(sha256sum "$FILE" | awk '{print $1}')" || true
            if [ -n "$NEW_HASH" ]; then
              if ! cp -a "${makefile}.sdc-backup" "$makefile"; then
                echo "❌ FATAL: Failed to restore backup for hash insertion in $name"
                echo "❌ CRITICAL: Preserving backup: ${makefile}.sdc-backup and halting execution." >&2
                return 1
              fi
              
              if grep -Eq '^[[:space:]]*PKG_HASH[[:space:]]*(:=|\?=|=)' "$makefile"; then
                if ! sed -i -E "s/^[[:space:]]*PKG_HASH[[:space:]]*(:=|\?=|=).*/PKG_HASH:=$NEW_HASH/" "$makefile"; then
                  echo "❌ FATAL: Failed to write new PKG_HASH for $name"
                  if ! restore_original_makefile; then exit 1; fi
                  return 1
                fi
              else
                if ! printf '\nPKG_HASH:=%s\n' "$NEW_HASH" >> "$makefile"; then
                  echo "❌ FATAL: Failed to append new PKG_HASH for $name"
                  if ! restore_original_makefile; then exit 1; fi
                  return 1
                fi
              fi

              if ! sed -i -E '/^[[:space:]]*PKG_MIRROR_HASH/d' "$makefile"; then
                echo "❌ FATAL: Failed to purge PKG_MIRROR_HASH for $name"
                if ! restore_original_makefile; then exit 1; fi
                return 1
              fi
              
              local HASH_LINES
              HASH_LINES="$(grep -Ec '^[[:space:]]*PKG_HASH[[:space:]]*(:=|\?=|=)' "$makefile")"
              if [ "$HASH_LINES" -ne 1 ]; then
                 echo "❌ FATAL: Expected exactly one PKG_HASH assignment, got $HASH_LINES"
                 if ! restore_original_makefile; then exit 1; fi
                 return 1
              fi
              
              if grep -Fxq "PKG_HASH:=$NEW_HASH" "$makefile"; then
                echo "✅ $name: Upstream aligned & Verified"
                echo "   Source : $FILE"
                echo "   SHA256 : $NEW_HASH"
                rm -f "${makefile}.sdc-backup"
                return 0
              else
                echo "❌ FATAL: SHA256 write verification failed for $name"
                if ! restore_original_makefile; then
                  echo "❌ CRITICAL: Backup preserved due to failed secondary rollback." >&2
                fi
                return 1
              fi
            else
              echo "❌ FATAL: SHA256 calculation failed for $name"
              if ! restore_original_makefile; then exit 1; fi
              return 1
            fi
          }

          if ! sync_hash "sing-box" "package/openwrt-passwall-packages/sing-box/Makefile"; then exit 1; fi
          if ! sync_hash "xray-core" "package/openwrt-passwall-packages/xray-core/Makefile"; then exit 1; fi
          
          echo "🔒 [SDC v2.0] Adaptive mode completed"
          # =====================================================
          
          echo "=== 🔐 Required Core Configuration Audit ==="
          for cfg in \
            CONFIG_USE_APK \
            CONFIG_CCACHE \
            CONFIG_PACKAGE_luci-app-passwall \
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray \
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox \
            CONFIG_PACKAGE_xray-core \
            CONFIG_PACKAGE_sing-box \
            CONFIG_PACKAGE_smartdns \
            CONFIG_PACKAGE_kmod-wireguard \
            CONFIG_PACKAGE_wireguard-tools
          do
            if ! grep -Eq "^${cfg}=y$" .config; then
              echo "❌ REQUIRED CONFIG MISSING: $cfg"
              exit 1
            fi
          done
          echo "✅ Required core configuration audit passed"

          echo "=== 🔒 Post-Defconfig Forbidden Package Audit ==="
          for p in block-mount luci-app-fstab luci-app-plugins; do
            if grep -Eq "^CONFIG_PACKAGE_${p}=[ym]" .config; then
              echo "❌ FORBIDDEN PACKAGE ENABLED AFTER DEFCONFIG: $p"
              exit 1
            fi
          done
          echo "✅ Post-defconfig forbidden package audit passed"
          
          gzip -9f -c .config > ../logs_full.config.gz
          
      - name: Build Firmware
        run: |
          set -euo pipefail
          source /tmp/sre_utils.sh
          cd openwrt
          
          IMM_DATE=$(git log -1 --format=%ct)
          PW_DATE=$(git -C package/openwrt-passwall log -1 --format=%ct 2>/dev/null || echo "$IMM_DATE")
          PWP_DATE=$(git -C package/openwrt-passwall-packages log -1 --format=%ct 2>/dev/null || echo "$IMM_DATE")
          export SOURCE_DATE_EPOCH=$(printf "%s\n%s\n%s" "$IMM_DATE" "$PW_DATE" "$PWP_DATE" | sort -n | tail -1)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> ../toolchain.info
          
          MONITOR_PID=""
          cleanup_monitor() {
            echo "🧹 關閉駕駛艙雷達..."
            [ -n "$MONITOR_PID" ] && kill "$MONITOR_PID" 2>/dev/null || true
          }
          trap cleanup_monitor EXIT INT TERM
          
          (
            echo "📡 BUILD MONITOR START"
            while true; do
              LOAD=$(uptime | awk -F'load average:' '{print $2}' | xargs)
              MEM=$(free -m | awk '/Mem:/ {printf "%d/%dMB | %.0f%%", $3, $2, ($3/$2)*100}')
              DISK=$(df -h / | awk 'NR==2 {print $5}')
              echo "[MONITOR]  $LOAD | $MEM | DISK: $DISK"
              sleep 120 || true
            done
          ) &
          MONITOR_PID=$!
          
          echo "=== CCACHE STATISTICS RESET ==="
          ccache -z || true
          
          if ! retry bash -c 'make download -j$(nproc)'; then
            {
              echo "BUILD_RESULT=FAILED"
              echo "BUILD_MODE=DOWNLOAD"
              echo "BUILD_FAILED=true"
            } > ../build-status.txt
            exit 1
          fi
          
          BUILD_RESULT="SUCCESS"
          BUILD_MODE="PARALLEL"
          echo "▶️ [Step] Starting main compilation..."
          if ! make -j$(nproc) 2>&1 | tee >(gzip -1 -c > ../logs_build.log.gz); then
            echo "⚠️ [Parallel Build Failed] Retrying with -j1 V=s (Keeping build state)..."
            BUILD_MODE="FALLBACK_J1"
            if ! make -j1 V=s BUILD_LOG=1 2>&1 | tee >(gzip -1 -c > ../logs_build_debug.log.gz); then
              BUILD_RESULT="FAILED"
              {
                echo "BUILD_RESULT=$BUILD_RESULT"
                echo "BUILD_MODE=$BUILD_MODE"
                echo "BUILD_FAILED=true"
              } > ../build-status.txt
              exit 1
            fi
          fi
          echo "BUILD_RESULT=$BUILD_RESULT" >> ../build-status.txt
          echo "BUILD_MODE=$BUILD_MODE" >> ../build-status.txt
          
          echo "=== CCACHE STATISTICS ==="
          ccache -s || true
          ccache -s > ../logs_ccache.txt 2>&1 || true
          
      - name: Save Cache (dl)
        uses: actions/cache/save@v5
        continue-on-error: true
        if: success() && !cancelled()
        with:
          path: |
            openwrt/dl
          key: ${{ steps.var.outputs.dl_key }}
          
      - name: Save Cache (ccache)
        uses: actions/cache/save@v5
        continue-on-error: true
        if: success() && !cancelled()
        with:
          path: ~/.ccache
          key: ${{ steps.var.outputs.ccache_key }}

      - name: Validate & Final Packaging
        run: |
          set -euo pipefail
          
          # 🔒 Mandatory Build Gate Enforcement
          if ! grep -Fxq 'BUILD_RESULT=SUCCESS' build-status.txt 2>/dev/null; then
            echo "❌ FATAL: BUILD_RESULT is not SUCCESS or build-status.txt is missing"
            cat build-status.txt 2>/dev/null || true
            exit 1
          fi

          ROOT="$(pwd)"
          TARGET_DIR="openwrt/bin/targets/x86/64"
          mkdir -p release_assets
          
          [ -d "$TARGET_DIR" ] || exit 1
          cd "$TARGET_DIR"
          
          : > "$ROOT/release_assets/sha256sums"
          for img in *combined*.img.gz; do
            [ -f "$img" ] || continue
            sha256sum "$img" >> "$ROOT/release_assets/sha256sums"
            install -m644 "$img" "$ROOT/release_assets/"
          done
          [ -s "$ROOT/release_assets/sha256sums" ] || { echo "❌ FATAL: No combined image checksum found"; exit 1; }
          sha256sum -c "$ROOT/release_assets/sha256sums" || exit 1
          
          # 🟢 [Fixed Issue #2 Closure] 驗證 release_assets 發布目錄自身的 SHA256 完整性
          (
            cd "$ROOT/release_assets"
            sha256sum -c sha256sums
          ) || exit 1
          
          cd "$ROOT"
          [ -z "$(find release_assets -type f -name "*combined*.img.gz")" ] && { echo "Firmware missing!"; exit 1; }
          
          find openwrt/bin/targets/x86/64 -name "*.manifest" -exec sh -c 'echo "=== $(basename "$1") ==="; cat "$1"; echo' _ {} \; > release_assets/installed-packages.txt
          
          if [ ! -s release_assets/installed-packages.txt ]; then
            echo "❌ FATAL: Final firmware manifest is missing or empty"
            exit 1
          fi
          
          echo "=== 🔒 Final Manifest Package Audit ==="
          for p in block-mount luci-app-fstab luci-app-plugins; do
            if awk -v pkg="$p" '$1 == pkg {found=1} END {exit found ? 0 : 1}' release_assets/installed-packages.txt; then
              echo "❌ FORBIDDEN PACKAGE FOUND IN FINAL MANIFEST: $p"
              exit 1
            fi
          done
          
          echo "=== 🔐 Final Native Core Manifest Audit ==="
          for p in luci-app-passwall xray-core sing-box; do
            if ! awk -v pkg="$p" '$1 == pkg {found=1} END {exit found ? 0 : 1}' release_assets/installed-packages.txt; then
              echo "❌ REQUIRED FINAL PACKAGE MISSING IN MANIFEST: $p"
              exit 1
            fi
          done
          echo "✅ Final manifest package audit passed"
          
          if [ -d openwrt/bin/packages ]; then
            find openwrt/bin/packages -name "*.apk" | sort > release_assets/apk-list.txt
          fi
          [ -s release_assets/apk-list.txt ] || rm -f release_assets/apk-list.txt
          
          OW_RELEASE="$(find openwrt/build_dir/target-x86_64_musl* -type f -path '*/root-*/etc/openwrt_release' -print -quit 2>/dev/null || true)"
          if [ -n "$OW_RELEASE" ] && [ -f "$OW_RELEASE" ]; then
            OW_REV=$(grep DISTRIB_REVISION "$OW_RELEASE" | head -n 1 | cut -d= -f2 | tr -d "'" || echo "unknown")
          else
            OW_REV="unknown"
          fi
          [ -z "$OW_REV" ] && OW_REV="unknown"
          
          cat << EOF > release_assets/build-info.txt
          Build Date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')
          Branch: Master (Snapshot)
          OpenWrt Version: $OW_REV
          Workflow Run ID: ${{ github.run_id }}
          Runner OS: ${{ runner.os }}
          Runner Image OS: ${ImageOS:-unknown}
          Runner Image Version: ${ImageVersion:-unknown}
          Runner Arch: $(uname -m)
          Kernel: $(uname -r)
          CPU: $(nproc) logical CPUs
          Memory: $(free -h | awk '/Mem:/ {print $2}')
          SOURCE_DATE_EPOCH: $(grep SOURCE_DATE_EPOCH toolchain.info | cut -d= -f2 || echo unknown)
          ImmortalWrt Commit: $(git -C openwrt rev-parse HEAD 2>/dev/null || echo unknown)
          PassWall Commit: $(git -C openwrt/package/openwrt-passwall rev-parse HEAD 2>/dev/null || echo unknown)
          PassWall Packages Commit: $(git -C openwrt/package/openwrt-passwall-packages rev-parse HEAD 2>/dev/null || echo unknown)
          Build Result: $(cat build-status.txt 2>/dev/null | grep BUILD_RESULT || echo "UNKNOWN")
          Build Mode: $(cat build-status.txt 2>/dev/null | grep BUILD_MODE || echo "UNKNOWN")
          EOF
          
          [ -s feeds.snapshot.txt ] && install -m644 feeds.snapshot.txt release_assets/feeds.snapshot
          [ -s toolchain.info ] && install -m644 toolchain.info release_assets/toolchain.info
          [ -s logs_full.config.gz ] && install -m644 logs_full.config.gz release_assets/full.config.gz
          [ -s logs_diffconfig.txt ] && install -m644 logs_diffconfig.txt release_assets/diffconfig.txt
          [ -s build-status.txt ] && install -m644 build-status.txt release_assets/
          [ -s logs_build.log.gz ] && install -m644 logs_build.log.gz release_assets/
          [ -s logs_build_debug.log.gz ] && install -m644 logs_build_debug.log.gz release_assets/
          [ -s logs_ccache.txt ] && install -m644 logs_ccache.txt release_assets/
          [ -s /tmp/retry_history.log ] && install -m644 /tmp/retry_history.log release_assets/
          [ -s /tmp/retry_debug.log ] && gzip -9 -c /tmp/retry_debug.log > release_assets/retry_debug.log.gz || true
          
          find release_assets -type f -empty -print -delete
          
      - name: Failure Archaeology Artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ImmWrt-Snapshot-Archaeology-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: |
            toolchain.info
            feeds.snapshot.txt
            build-status.txt
            logs_diffconfig.txt
            logs_full.config.gz
            logs_build.log.gz
            logs_build_debug.log.gz
            logs_ccache.txt
            /tmp/retry_history.log
            /tmp/retry_debug.log
            openwrt/.config
            openwrt/package/openwrt-passwall*/**/Makefile
            openwrt/package/openwrt-passwall*/**/*.sdc-backup

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: SNAPSHOT-b${{ github.run_number }}-a${{ github.run_attempt }}-${{ steps.meta.outputs.date }}
          target_commitish: ${{ github.sha }}
          name: ImmWrt Master Snapshot
          body: |
            ### 🧪 ImmWrt Master Snapshot — Experimental Production-Sealed Candidate
            - **顯式宣告 APK**：在設定檔中明確宣告 `CONFIG_USE_APK=y`，鎖定底層套件管理架構。
            - **四重狀態封鎖 (State Blocking)**：透過「Kconfig 原生禁用 → Defconfig 收斂 → Post-Defconfig 正向/反向審計 → 最終 Manifest 雙向審計」，徹底杜絕 `block-mount`、`luci-app-fstab` 與 `luci-app-plugins` 等依賴回歸。
            - **嚴格驗證機制**：Post-Defconfig 深度配置審計（含正向核心合約檢查）；最終韌體 Manifest 缺失致命化；SHA256 校驗強制完全比對，拒絕寬容通過。
            - **PassWall 最新主幹同步**：即時拉取最新 `openwrt-passwall` 與 `openwrt-passwall-packages` 最新 commit。
            - **備份引擎升級**：內建 `ib v1.8` 黃金基準垂直排版版，解耦套件強依賴，確保跨版本配置恢復安全。
            - **網路核心擴展**：完整嵌入 `WireGuard` 核心套件、密碼學底層模組、`wireguard-tools` 工具鏈及 `qrencode` (QR Code 支援)。
            - **自癒架構 (SDC v2.0 Strict)**：導入整份 Makefile 無損快照；任何可恢復異常皆觸發原始狀態回滾，遭拒時強制保留備份現場並中止 CI。寫入後強制校驗 Exact-One 配置，確保依賴樹語意完整。
            - **嚴格退回機制 (Strict No-Guess Resolution)**：SDC 僅接受 dumpinfo 解析出的「剛好一個」Exact Source；下載、驗證、寫入任一階段失敗即完整回滾並中止 CI，不使用萬用字元猜測 fallback。
            - **可復現性時間基準 Epoch**：以 ImmortalWrt、PassWall、PassWall Packages 三方倉庫中最新 Commit Timestamp 作為 `SOURCE_DATE_EPOCH` 基準；Swap 防漂移：無 Swap 時建立 4GB 裝甲，已有則保留。
            - **快取綱要嚴格隔離**：快取採 Immutable Cumulative Generation：每次 Run 使用唯一 generation key，並透過 feeds snapshot 二級梯隊與 restore-prefix 繼承可用快取，形成跨 Run 的累積式增量編譯鏈。
            - **Node 24 Ready**：執行環境為 ubuntu-24.04，採用 Node 24 相容的 Actions 版本，並透過 `FORCE_JAVASCRIPT_ACTIONS_TO_NODE24` 預先指定 Actions runtime 使用 Node 24，降低後續 Actions 遷移風險。
            - **Snapshot Native Track**：雙核心滿血火力全開：完整編譯並保留 Xray-core 與 Sing-box 核心，驗證上游最新分流元件穩定性。
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
