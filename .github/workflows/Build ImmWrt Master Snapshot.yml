name: 🧪 Diagnose libgcc_s Location

on:
  workflow_dispatch:

jobs:
  diagnose-libgcc:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            jq \
            python3-setuptools \
            ninja-build \
            meson

      - name: Clone ImmortalWrt Master
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            -b master \
            https://github.com/immortalwrt/immortalwrt.git \
            openwrt

          cd openwrt

          echo "ImmortalWrt:"
          git rev-parse HEAD

      - name: Update And Install Feeds
        run: |
          set -euo pipefail

          cd openwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a -f

      - name: Generate Minimal Config
        run: |
          set -euo pipefail

          cd openwrt

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          EOF

          make defconfig

      - name: Build Toolchain
        run: |
          set -euo pipefail

          cd openwrt

          make toolchain/install \
            -j"$(nproc)" \
            V=s

      - name: Locate libgcc_s
        run: |
          set -euo pipefail

          cd openwrt

          echo "===== GCC ====="

          GCC_BIN="$(
            find staging_dir/toolchain-x86_64_* \
              -type f \
              -name 'x86_64-openwrt-linux-musl-gcc' \
              | head -n 1
          )"

          if [ -z "${GCC_BIN}" ]; then
            echo "❌ OpenWrt target GCC not found"
            exit 1
          fi

          echo "GCC: ${GCC_BIN}"
          "${GCC_BIN}" --version | head -n 1

          echo
          echo "===== GCC libgcc_s Resolution ====="

          LIBGCC="$(
            "${GCC_BIN}" \
              -print-file-name=libgcc_s.so
          )"

          echo "GCC reports:"
          echo "${LIBGCC}"

          echo
          echo "===== libgcc_s Files ====="

          find staging_dir \
            -type f \
            -name 'libgcc_s.so*' \
            -print \
            | sort

          echo
          echo "===== Expected Directory ====="

          TOOLCHAIN_DIR="$(
            dirname \
              "$(dirname \
                "$(dirname "${GCC_BIN}")")"
          )"

          echo "${TOOLCHAIN_DIR}/lib/"

          echo
          echo "===== Expected Directory Contents ====="

          ls -lah \
            "${TOOLCHAIN_DIR}/lib/" \
            2>/dev/null || true

          echo
          echo "===== GCC Search Result ====="

          if [ -e "${LIBGCC}" ]; then
            echo "✅ GCC resolved libgcc_s successfully"
            readlink -f "${LIBGCC}" || true
          else
            echo "❌ GCC did NOT resolve libgcc_s"
          fi

          echo
          echo "===== Final Diagnosis ====="

          EXPECTED_GLOB="${TOOLCHAIN_DIR}/lib/libgcc_s.so.*"

          if compgen -G "${EXPECTED_GLOB}" > /dev/null; then
            echo "✅ EXPECTED libgcc_s EXISTS"
            printf '%s\n' ${EXPECTED_GLOB}
          else
            echo "❌ EXPECTED libgcc_s DOES NOT EXIST"
          fi

      - name: Verify Toolchain Package Failure Condition
        run: |
          set -euo pipefail

          cd openwrt

          TOOLCHAIN_DIR="$(
            find staging_dir \
              -maxdepth 1 \
              -type d \
              -name 'toolchain-x86_64_*' \
              | head -n 1
          )"

          echo "Toolchain staging:"
          echo "${TOOLCHAIN_DIR}"

          echo
          echo "libgcc_s candidates:"
          find "${TOOLCHAIN_DIR}" \
            -type f \
            -name 'libgcc_s.so*' \
            -print \
            | sort

          echo
          echo "Exact path used by failing Makefile:"
          ls -l \
            "${TOOLCHAIN_DIR}/lib/libgcc_s.so."* \
            2>/dev/null \
            || echo "❌ EXACT FAILING PATH DOES NOT EXIST"

      - name: Collect Diagnostic
        if: always()
        run: |
          set +e

          mkdir -p diagnostics

          {
            echo "ImmortalWrt:"
            git -C openwrt rev-parse HEAD

            echo
            echo "Toolchain directories:"
            find openwrt/staging_dir \
              -maxdepth 1 \
              -type d \
              -name 'toolchain-*' \
              -print

            echo
            echo "All libgcc_s:"
            find openwrt/staging_dir \
              -type f \
              -name 'libgcc_s.so*' \
              -print

            echo
            echo "GCC:"
            find openwrt/staging_dir \
              -type f \
              -name 'x86_64-openwrt-linux-musl-gcc' \
              -print

            echo
            echo "Toolchain Makefile libgcc references:"
            grep -n \
              'libgcc_s' \
              openwrt/package/libs/toolchain/Makefile \
              2>/dev/null || true

          } > diagnostics/libgcc-location.txt

      - name: Upload Diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libgcc-location-diagnostic
          path: diagnostics/
          retention-days: 7
