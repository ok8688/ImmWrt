# =====================================================================
# 🛡️ [STABLE] - ImmWrt 25.12.0 (穩定正式版 - 100/100 傳世典藏版)
# =====================================================================
# 狀態：基於 25.12.0 正式版架構，鎖定主線 (master) 穩定構建。
# 核心：維持 CONFIG_PACKAGE_luci=y，驅動 CONFIG_LUCI_LANG_zh_Hans。
# 終極修正：極致 apt 空間釋放、雙重產物空投阻斷 (combined & sha256sums)。
# =====================================================================

name: Build ImmWrt 25.12.0 Stable

on:
  workflow_dispatch:
  schedule:
    - cron: '26 14 * * 0,2,4,6' # HKT 22:26 (每週日、二、四、六)

concurrency:
  group: immwrt-build
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Inject SRE Core Utilities
        run: |
          cat << 'EOF' > /tmp/sre_utils.sh
          #!/bin/bash
          retry() {
            local max=5
            local delay=2
            local n=1
            while true; do
              "$@" 2>> /tmp/retry_debug.log && break || {
                if [[ $n -lt $max ]]; then
                  echo "⚠️ [FAIL] Attempt $n: $@" >> /tmp/retry_history.log
                  ((n++))
                  delay=$((delay * 2 + RANDOM % 3))
                  sleep $delay
                else
                  echo "❌ FAILED after $max retries: $@"
                  echo "--- Retry History ---"
                  cat /tmp/retry_history.log || true
                  echo "--- Debug Log ---"
                  cat /tmp/retry_debug.log || true
                  exit 1
                fi
              }
            done
          }
          EOF
          chmod +x /tmp/sre_utils.sh
          
      - name: Init SRE Environment & Space Cleanup
        run: |
          set -euo pipefail
          echo "=== 💥 啟動沙皇級核爆清理 (釋放極限空間) ==="
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/share/swift \
            /usr/local/lib/node_modules \
            /opt/hostedtoolcache \
            /usr/local/share/powershell \
            /usr/share/rust \
            /opt/microsoft \
            /usr/local/share/edge_driver \
            /usr/local/.ghcup \
            /usr/share/miniconda \
            /opt/az \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/lib/heroku
            
          sudo docker system prune -af || true
          sudo apt-get clean
          # 採納大師微優化：徹底清空 apt 快取清單，榨乾最後一滴可用空間
          sudo rm -rf /var/lib/apt/lists/*
          
          echo "=== 🚀 部署依賴與內存裝甲 (精簡模式) ==="
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            jq \
            golang-go \
            python3-setuptools
            
          sudo apt-get install -y --no-install-recommends python3-distutils || true
            
          sudo swapoff -a || true
          # 4G Swap 甜蜜點，防禦 OOM 且避免 IO 顛簸
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
          echo "=== 🧬 Deep ABI Fingerprint ===" > toolchain.info
          uname -r >> toolchain.info
          gcc --version | head -n 1 >> toolchain.info
          ld --version | head -n 1 >> toolchain.info
          ldd --version | head -n 1 >> toolchain.info
          dpkg -s libc6 | grep Version >> toolchain.info
          go version >> toolchain.info || true
          
      - name: Clone & Official PassWall Main Source
        run: |
          set -euo pipefail
          source /tmp/sre_utils.sh
          # 🚀 鎖定主線源碼 (depth=1 節省大量 IO 與時間)
          retry git clone --depth=1 -b master https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          
          retry ./scripts/feeds update -a
          
          # ✅ 物理防護 - 徹底切斷舊版供應鏈
          rm -rf feeds/luci/applications/luci-app-passwall
          rm -rf feeds/packages/net/xray-core
          rm -rf feeds/packages/net/sing-box
          rm -rf package/feeds/luci/luci-app-passwall
          rm -rf package/feeds/packages/xray-core
          rm -rf package/feeds/packages/sing-box
          
          # 🚀 拉取官方最新 PassWall
          retry git clone --depth=1 \
            https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git \
            package/openwrt-passwall-packages
          retry git clone --depth=1 \
            https://github.com/Openwrt-Passwall/openwrt-passwall.git \
            package/openwrt-passwall
            
          retry ./scripts/feeds install -a -f

          # 🚀 黃金定點抹除法 (掛載點)
          ./scripts/feeds uninstall luci-app-fstab || true
          rm -rf feeds/luci/applications/luci-app-fstab
          rm -rf package/feeds/luci/luci-app-fstab
          MENU_DIR="feeds/luci/modules/luci-mod-system/root/usr/share/luci/menu.d"
          if [ -d "$MENU_DIR" ]; then
            for f in $MENU_DIR/*.json; do
              [ -f "$f" ] || continue
              jq 'del(."admin/system/mounts", ."admin/services/mounts")' \
                "$f" > "$f.tmp" && mv "$f.tmp" "$f" || true
            done
          fi
          
          find feeds package -type d -name ".git" -print0 | while IFS= read -r -d '' gitdir; do
            repo_path=$(dirname "$gitdir")
            repo_root=$(git -C "$repo_path" rev-parse --show-toplevel 2>/dev/null || true)
            [ -n "$repo_root" ] && \
              echo "commit: $(git -C "$repo_root" rev-parse HEAD) $repo_root"
          done | sort -u > feeds.snapshot.txt
          
      - name: Generate Core Config & Global Language Setup
        run: |
          set -euo pipefail
          cd openwrt
          mkdir -p logs
          
          # 🇨🇳 UCI 保險機制，鎖定 zh_cn
          mkdir -p files/etc/uci-defaults
          cat << 'EOF' > files/etc/uci-defaults/99-force-language
          #!/bin/sh
          uci -q set luci.main.lang='zh_cn'
          uci -q commit luci
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-force-language
          
          # ==========================================================
          # ⚙️ 核心套件清單 (全局語言主控變數)
          # ==========================================================
          {
            echo "CONFIG_TARGET_x86=y"
            echo "CONFIG_TARGET_x86_64=y"
            echo "CONFIG_TARGET_x86_64_DEVICE_generic=y"
            echo "CONFIG_TARGET_ROOTFS_PARTSIZE=1536"
            echo "CONFIG_TARGET_IMAGES_GZIP=y"
            echo "CONFIG_PACKAGE_luci=y"
            
            # 🌐 核心全局語言入口
            echo "CONFIG_LUCI_LANG_zh_Hans=y"
            
            echo "CONFIG_PACKAGE_luci-app-passwall=y"
            echo "CONFIG_PACKAGE_xray-core=y"
            echo "CONFIG_PACKAGE_sing-box=y"
            echo "CONFIG_PACKAGE_geoview=y"
            
            echo "CONFIG_PACKAGE_ca-bundle=y"
            echo "CONFIG_PACKAGE_ca-certificates=y"
            echo "CONFIG_PACKAGE_smartdns=y"
            echo "CONFIG_PACKAGE_luci-app-smartdns=y"
            echo "CONFIG_PACKAGE_luci-app-ddns=y"
            echo "CONFIG_PACKAGE_ddns-scripts-cloudflare=y"
            echo "CONFIG_PACKAGE_luci-app-upnp=y"
            
            echo "CONFIG_PACKAGE_luci-theme-argon=y"
            echo "CONFIG_PACKAGE_luci-app-argon-config=y"
            
            echo "CONFIG_PACKAGE_qemu-ga=y"
            echo "CONFIG_PACKAGE_irqbalance=y"
            echo "CONFIG_PACKAGE_luci-app-ttyd=y"
            echo "CONFIG_PACKAGE_luci-app-advanced-reboot=y"
            
            echo "CONFIG_PACKAGE_htop=y"
            echo "CONFIG_PACKAGE_ethtool=y"
            echo "CONFIG_PACKAGE_nano=y"
            echo "CONFIG_PACKAGE_curl=y"
            echo "CONFIG_PACKAGE_wget-ssl=y"
            echo "CONFIG_PACKAGE_unzip=y"
            echo "CONFIG_PACKAGE_kmod-tcp-bbr=y"
            echo "CONFIG_PACKAGE_kmod-virtio-net=y"
            echo "CONFIG_PACKAGE_kmod-virtio-blk=y"
            echo "CONFIG_PACKAGE_kmod-nft-offload=y"
            echo "CONFIG_PACKAGE_block-mount=n"
            echo "CONFIG_PACKAGE_luci-app-fstab=n"
            echo "# CONFIG_CCACHE is not set"
          } > .config
          make defconfig
          
          # ==========================================================
          # 🚨 工業級 SRE 測試左移：精準依賴掃描與配置導出
          # ==========================================================
          echo "===== 🕵️‍♂️ SRE FINAL CHECK: LUCI LANG ====="
          grep "LUCI_LANG" .config || true
          
          echo "===== 🕵️‍♂️ SRE FINAL CHECK: SELECTED I18N PACKAGES ====="
          grep -E "^CONFIG_PACKAGE_(luci-i18n|luci-app-)" .config > logs/selected-packages.log || true
          head -n 300 logs/selected-packages.log
          
          echo "===== 🕵️‍♂️ SRE FINAL CHECK: PASSWALL MAKEFILE DEEP SEARCH ====="
          grep -rE "LUCI_LANG|LUCI_LC_ALIAS|luci-i18n|PKG_LANG|zh-cn" package/openwrt-passwall 2>/dev/null > logs/passwall-language.log || true
          head -n 300 logs/passwall-language.log
          
          echo "===== 🕵️‍♂️ SRE FINAL CHECK: GLOBAL FEED LANGUAGE RADAR ====="
          grep -rE "LUCI_LANG|LUCI_LC_ALIAS|luci-i18n|PKG_LANG" feeds package 2>/dev/null > logs/global-feed-language.log || true
          head -n 300 logs/global-feed-language.log
          
          ./scripts/diffconfig.sh > logs/diffconfig.txt
          gzip -9 -c .config > logs/full.config.gz
          
      - name: Generate Cache Variables
        id: var
        run: |
          echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT
          echo "dl_key=dl-25.12.0-${{ hashFiles('openwrt/feeds.conf.default', 'openwrt/feeds.snapshot.txt') }}" >> $GITHUB_OUTPUT
          
      - name: Restore Cache
        id: cache_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/dl
          key: ${{ steps.var.outputs.dl_key }}
          restore-keys: |
            dl-25.12.0-
            
      - name: Build Firmware
        run: |
          set -euo pipefail
          source /tmp/sre_utils.sh
          cd openwrt
          [ -f feeds.snapshot.txt ] && \
            cp feeds.snapshot.txt logs/snapshot.sbom || true
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct || date +%s)
          
          # ==========================================
          # 📡 啟動 SRE 駕駛艙雷達
          # ==========================================
          MONITOR_PID=""
          cleanup_monitor() {
            echo "🧹 關閉駕駛艙雷達..."
            [ -n "$MONITOR_PID" ] && kill "$MONITOR_PID" 2>/dev/null || true
          }
          trap cleanup_monitor EXIT INT TERM
          
          (
            echo "📡 BUILD MONITOR START"
            while true; do
              LOAD=$(uptime | awk -F'load average:' '{print $2}' | xargs)
              echo "[MONITOR] $(date '+%H:%M:%S') | CPU Load: $LOAD | RAM: $(free -m | awk '/Mem:/ {print $3"/"$2"MB"}') | DISK: $(df -h / | awk 'NR==2 {print $5}')"
              sleep 120 || true
            done
          ) &
          MONITOR_PID=$!
          # ==========================================
          
          touch logs/build-debug.log
          
          for i in 1 2 3; do
            make download -j$(nproc) && break || {
              sleep $((i * 5))
            }
            [ $i -eq 3 ] && make download -j1 V=s
          done
          
          if ! make -j$(nproc) 2>&1 | tee logs/build.log; then
            echo "⚠️ [FAIL] 快速編譯失敗，啟動核爆級重置與單線程除錯編譯..."
            rm -rf tmp build_dir staging_dir
            make -j1 V=s 2>&1 | tee logs/build-debug.log || exit 1
          fi
          
      - name: Save Cache
        uses: actions/cache/save@v4
        if: success() && !cancelled()
        with:
          path: |
            openwrt/dl
          key: ${{ steps.var.outputs.dl_key }}

      - name: Validate & Final SBOM
        run: |
          set -euo pipefail
          cd openwrt
          
          # =========================================================================
          # 📡 產物遙測與空投阻斷 (Pre-Release Check)
          # =========================================================================
          cd bin/targets/x86/64/
          
          # 採納大師雙重阻斷：韌體與 Checksum 皆不可或缺
          FIRMWARE_COUNT=$(find . -name "*combined*.img.gz" -type f | wc -l)
          if [ "$FIRMWARE_COUNT" -eq 0 ]; then
            echo "::error title=Firmware Missing::❌ 未檢測到 *combined*.img.gz 產物，編譯可能已嚴重損壞，中斷發布！"
            exit 1
          fi
          if [ ! -f "sha256sums" ]; then
            echo "::error title=Checksums Missing::❌ 未檢測到 sha256sums 檔案，目標映像命名可能已改變，中斷發布！"
            exit 1
          fi
          echo "✅ 檢測到 $FIRMWARE_COUNT 個韌體映像檔與校驗檔，準備發布。"
          
          find . -name "*combined*.img.gz" -type f | sort | \
            xargs sha256sum > manifest.txt || true
          sha256sum --ignore-missing -c sha256sums || true
          mv manifest.txt ../../../../logs/ || true
          
          cd ../../../../
          
          # 搜尋 APKINDEX 與 Packages 中繼資料
          find bin/packages -type f \( -name "APKINDEX*" -o -name "Packages*" \) > logs/apk-indexes.log || true
          head -n 30 logs/apk-indexes.log
          
          # 直接狙擊實體的 luci-i18n 檔案
          find bin/packages -type f -name "*luci-i18n*" > logs/luci-i18n-packages.log || true
          head -n 30 logs/luci-i18n-packages.log
          
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: STABLE-b${{ github.run_number }}-${{ steps.var.outputs.date }}
          name: ImmWrt 25.12.0 (穩定正式版)
          body: |
            ### 🛡️ ImmWrt 25.12.0 (穩定正式版)
            - **系統基底**：鎖定 `25.12.0` 主線架構，部署工業級安全防禦與極致空間壓榨 (`-j$(nproc)`, `4G Swap`, 精簡 APT 依賴)。
            - **空投防護**：搭載雙重 Fail-fast 阻斷機制 (映像與 Checksum 校驗)，確保發布產物絕對可用。
            - **全景可觀測性**：配置環境已無損壓縮打包，全量診斷日誌已匯出至附件，編譯失敗可直查 `build-debug.log`。
          files: |
            openwrt/bin/targets/x86/64/*combined*.img.gz
            openwrt/bin/targets/x86/64/sha256sums
            openwrt/logs/manifest.txt
            openwrt/logs/snapshot.sbom
            openwrt/logs/diffconfig.txt
            openwrt/logs/full.config.gz
            openwrt/logs/selected-packages.log
            openwrt/logs/passwall-language.log
            openwrt/logs/apk-indexes.log
            openwrt/logs/luci-i18n-packages.log
            openwrt/logs/build.log
            openwrt/logs/build-debug.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
