name: Build ImmWrt v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # ✅ 优化后的缓存：只缓存源码压缩包，防爆内存，极致提速
      - name: Cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ${{ runner.os }}-immwrt-${{ hashFiles('**/*.yml') }}

      - name: Init
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget jq

      - name: Clone
        run: |
          git clone -b v25.12.0-rc2 --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          
          # 物理删除旧版，为官方正统源让路
          rm -rf feeds/luci/applications/luci-app-passwall
          rm -rf feeds/packages/net/passwall
          rm -rf feeds/packages/net/xray-core
          rm -rf feeds/packages/net/sing-box

          # 强行注入 Passwall 官方组织最新版
          git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/openwrt-passwall-packages
          git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall.git package/openwrt-passwall

          ./scripts/feeds install -a

      - name: Config
        run: |
          cd openwrt
          rm -f .config

          echo "CONFIG_TARGET_x86=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config

          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=2048" >> .config
          echo "CONFIG_TARGET_ROOTFS_EXT4FS=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_SQUASHFS=n" >> .config
          echo "CONFIG_TARGET_IMAGES_GZIP=y" >> .config

          echo "CONFIG_PACKAGE_luci-light=y" >> .config
          echo "CONFIG_PACKAGE_luci-mod-admin-full=y" >> .config
          echo "CONFIG_LUCI_LANG_zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config

          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-argon-config=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y" >> .config

          echo "CONFIG_PACKAGE_luci-app-passwall=y" >> .config
          echo "CONFIG_PACKAGE_xray-core=y" >> .config
          echo "CONFIG_PACKAGE_sing-box=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y" >> .config

          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
          echo "CONFIG_PACKAGE_smartdns=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-smartdns=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-smartdns-zh-cn=y" >> .config

          # ✅ 多核网络优化组件 (N100 绝杀利器)
          echo "CONFIG_PACKAGE_kmod-nft-offload=y" >> .config
          echo "CONFIG_PACKAGE_firewall4=y" >> .config
          echo "CONFIG_PACKAGE_irqbalance=y" >> .config
          echo "CONFIG_PACKAGE_ethtool=y" >> .config

          echo "CONFIG_PACKAGE_luci-app-ddns=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_ddns-scripts-cloudflare=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-upnp=y" >> .config
          echo "CONFIG_PACKAGE_miniupnpd-nftables=y" >> .config

          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          echo "CONFIG_PACKAGE_ttyd=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_htop=y" >> .config
          echo "CONFIG_PACKAGE_curl=y" >> .config
          echo "CONFIG_PACKAGE_wget-ssl=y" >> .config

          # ✅ PVE 满血驱动包
          echo "CONFIG_PACKAGE_qemu-ga=y" >> .config
          echo "CONFIG_PACKAGE_kmod-virtio-net=y" >> .config
          echo "CONFIG_PACKAGE_kmod-virtio-blk=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-advanced-reboot=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-advanced-reboot-zh-cn=y" >> .config

          # ❌ 抛弃 jq 野路子，直接从源头不编译挂载点菜单
          echo "CONFIG_PACKAGE_luci-app-fstab=n" >> .config
          echo "CONFIG_PACKAGE_block-mount=n" >> .config

          make defconfig

      - name: Optimize
        run: |
          cd openwrt

          # Argon 默认主题
          sed -i "s/bootstrap/argon/g" feeds/luci/modules/luci-base/root/etc/config/luci

          # ✅ 采用官方推荐的 uci-defaults 机制，极其优雅安全
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-init-settings << 'EOF'
          #!/bin/sh
          
          # 1. 优雅开启 Flow Offloading 转发加速 (告别 sed 强改源码)
          uci set firewall.@defaults[0].flow_offloading='1'
          uci commit firewall

          # 2. UPnP 开启并自启
          uci set upnpd.config.enabled='1'
          uci commit upnpd
          /etc/init.d/miniupnpd enable
          /etc/init.d/miniupnpd start
          
          # 3. 核心安全配置 (严格保证底层权限)
          [ -f /etc/config/smartdns ] && chmod 600 /etc/config/smartdns
          
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-init-settings

      # ✅ 预下载机制防断流
      - name: Download
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      # ✅ 固件上传
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ImmWrt-${{ github.run_number }}
          files: openwrt/bin/targets/x86/64/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
