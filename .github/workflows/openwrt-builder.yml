name: Build ImmWrt Enterprise Factory v3.17.1

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FEEDS_PARALLEL: 1

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # =============================================================
      # 🧱 1. 环境初始化与能力图谱声明 (L0: Determinism Layer)
      # =============================================================
      - name: Init & Deterministic Env
        run: |
          sudo apt update
          sudo apt install -y build-essential jq coreutils moreutils time
          
          # 🚨 需求落实：严型态能力图谱
          cat > $GITHUB_WORKSPACE/capability_graph.json << 'EOF'
          {
            "NETWORK_CORE": { "mandatory_pkgs": ["kmod-virtio-net", "block-mount"] },
            "SECURITY_TUNNEL": { "mandatory_pkgs": ["luci-app-passwall", "xray-core", "sing-box"] },
            "DNS_REINFORCEMENT": { "mandatory_pkgs": ["smartdns", "luci-app-smartdns"] },
            "UX_LAYER": { "mandatory_pkgs": ["luci-theme-argon"] }
          }
          EOF

      - name: Clone Source & Immutable Feeds Lock
        run: |
          # 🚨 护栏 1：锁定核心源码版本
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt
          
          cd openwrt
          # 🚨 护栏 2：注入确定性 Feeds 供应源，闭环 Passwall 依赖
          cat > feeds.conf.default << 'EOF'
          src-git packages https://github.com/immortalwrt/packages.git
          src-git luci https://github.com/immortalwrt/luci.git
          src-git routing https://github.com/immortalwrt/routing.git
          src-git telephony https://github.com/immortalwrt/telephony.git
          src-git passwall_pkgs https://github.com/itdog-info/openwrt-passwall-packages.git
          src-git passwall_luci https://github.com/itdog-info/openwrt-passwall.git
          EOF

      # =============================================================
      # 🔥 2. Feeds 供应链硬化 (Deterministic Directory Fix)
      # =============================================================
      - name: Hardened Feeds & Sync Directory
        run: |
          cd openwrt
          # 🚨 修正：强制清理残留索引与目录，防止 "No such file or directory" 报错
          rm -rf ./feeds ./package/feeds
          
          # 执行更新并增加重试逻辑，确保所有源物理落地
          ./scripts/feeds update -a || ./scripts/feeds update -a
          
          # 🚨 关键：显式刷新索引，确保 telephony 等目录在文件系统中就绪
          ./scripts/feeds update -i
          
          # 🚨 需求落实：物理切除挂载点 UI，保留底层核心
          rm -rf feeds/luci/applications/luci-app-fstab
          
          # 执行安装
          ./scripts/feeds install -a
          
          # 存证当前 Feeds 指纹
          ./scripts/feeds list -s > $GITHUB_WORKSPACE/feeds.provenance.lock

      # =============================================================
      # ⚙️ 3. 配置引擎 & 开机权限加固 (chmod 600)
      # =============================================================
      - name: Hardened Config & Security
        run: |
          cd openwrt
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-init-settings << 'EOF'
          #!/bin/sh
          # 🚨 需求落实：Argon 预设与 UPnP 封印
          uci set luci.main.mediaurlbase='/luci-static/argon'
          uci commit luci
          [ -f /etc/init.d/upnpd ] && /etc/init.d/upnpd disable
          # 🚨 需求落实：核心安全权限硬化 (SmartDNS 与 DHCP)
          [ -f /etc/config/smartdns ] && chmod 600 /etc/config/smartdns
          [ -f /etc/config/dhcp ] && chmod 600 /etc/config/dhcp
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-init-settings
          
          {
            echo "CONFIG_TARGET_x86=y"
            echo "CONFIG_TARGET_x86_64=y"
            echo "CONFIG_PACKAGE_luci-app-passwall=y"
            echo "CONFIG_PACKAGE_xray-core=y"
            echo "CONFIG_PACKAGE_sing-box=y"
            echo "CONFIG_PACKAGE_smartdns=y"
            echo "CONFIG_PACKAGE_luci-app-smartdns=y"
            echo "CONFIG_PACKAGE_luci-theme-argon=y"
            echo "CONFIG_PACKAGE_block-mount=y"
            echo "CONFIG_PACKAGE_kmod-virtio-net=y"
          } >> .config
          
          make defconfig

      # =============================================================
      # 🏗️ 4. 确定性编译执行 (Execution Layer)
      # =============================================================
      - name: Build World (Fault-Tolerant Strategy)
        run: |
          cd openwrt
          export FORCE_UNSAFE_CONFIGURE=1
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          # 🚨 护栏 3：多线程编译失败后自动切回单线程，应对 Xray/Sing-box 内存压力
          make package/compile -j$(nproc) V=s || make package/compile -j1 V=s
          make package/install -j$(nproc)
          make target/install -j$(nproc)

      # =============================================================
      # 🚨 5. 产物真值证明 (Artifact-Grounded Proof)
      # =============================================================
      - name: Artifact Proof Verdict
        run: |
          # 🚨 证明 1：双重索引提取 (Packages 索引 + 物理 IPK 扫描)
          find openwrt/bin/packages/ -name "Packages" -exec grep "^Package: " {} + | sed 's/^Package: //' | sort -u > $GITHUB_WORKSPACE/artifact.tokens.txt
          find openwrt/bin/packages/ -name "*.ipk" -o -name "*.apk" | xargs -n1 basename | sed -E 's/_[0-9].*//' | sort -u >> $GITHUB_WORKSPACE/artifact.tokens.txt
          sort -u $GITHUB_WORKSPACE/artifact.tokens.txt -o $GITHUB_WORKSPACE/artifact.tokens.txt
          
          # 🚨 证明 2：集合比对校验
          jq -r '.[] | .mandatory_pkgs[]' $GITHUB_WORKSPACE/capability_graph.json | sort -u > $GITHUB_WORKSPACE/required.tokens.txt
          comm -23 $GITHUB_WORKSPACE/required.tokens.txt $GITHUB_WORKSPACE/artifact.tokens.txt > $GITHUB_WORKSPACE/missing.tokens.txt
          
          if [ -s $GITHUB_WORKSPACE/missing.tokens.txt ]; then
            echo "❌ CRITICAL: Artifact Proof Failed! Mandatory components missing."
            cat $GITHUB_WORKSPACE/missing.tokens.txt
            exit 1
          fi
          
          # 🚨 证明 3：镜像生成检查
          ls openwrt/bin/targets/x86/64/ | grep -q "img.gz" || { echo "❌ NO FIRMWARE IMAGE FOUND"; exit 1; }
          echo "✅ Final Verdict: Artifacts verified and Image generated."

      # =============================================================
      # 📦 6. 确定性发布
      # =============================================================
      - name: Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ImmWrt-Factory-v3.17.1-${{ github.run_number }}
          files: |
            openwrt/bin/targets/x86/64/*.gz
            ${{ github.workspace }}/feeds.provenance.lock
            ${{ github.workspace }}/artifact.tokens.txt
