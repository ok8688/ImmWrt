name: OpenWrt B1r8 Stable Core Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # =========================
      # 🧠 环境（避免 Python / distutils 问题）
      # =========================
      - name: Init Environment
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-pip \
            rsync unzip zlib1g-dev file wget jq

      # =========================
      # 📥 Clone（稳定）
      # =========================
      - name: Clone Source
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt

      # =========================
      # 📦 Feeds（强制失败退出，避免隐性红 X）
      # =========================
      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a || exit 1
          ./scripts/feeds install -a || exit 1

      # =========================
      # ⚙️ Config（稳定最小可用集）
      # =========================
      - name: Generate Config
        run: |
          cd openwrt
          rm -f .config

          echo "CONFIG_TARGET_x86=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config

          # 2GB rootfs
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=2048" >> .config
          echo "CONFIG_TARGET_ROOTFS_EXT4FS=y" >> .config

          # LuCI
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-light=y" >> .config

          # Argon
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config

          # Passwall
          echo "CONFIG_PACKAGE_luci-app-passwall=y" >> .config

          # DNS
          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
          echo "CONFIG_PACKAGE_smartdns=y" >> .config

          # DDNS
          echo "CONFIG_PACKAGE_luci-app-ddns=y" >> .config

          # UPnP（稳定包名）
          echo "CONFIG_PACKAGE_luci-app-upnp=y" >> .config
          echo "CONFIG_PACKAGE_miniupnpd=y" >> .config

          # PVE / N100 virtio
          echo "CONFIG_PACKAGE_kmod-virtio-net=y" >> .config
          echo "CONFIG_PACKAGE_kmod-virtio-blk=y" >> .config

          make defconfig

      # =========================
      # 🧠 优化（全部加安全兜底）
      # =========================
      - name: Optimize
        run: |
          cd openwrt

          # Argon 默认
          sed -i "s/bootstrap/argon/g" feeds/luci/modules/luci-base/root/etc/config/luci || true

          # Flow offload
          sed -i '/flow_offloading/d' package/network/config/firewall/files/firewall.config || true
          echo "	option flow_offloading '1'" >> package/network/config/firewall/files/firewall.config || true

          # =========================
          # 🚨 挂载点删除（完全安全版）
          # =========================
          MENU_DIR="feeds/luci/modules/luci-mod-system/root/usr/share/luci/menu.d"

          if [ -d "$MENU_DIR" ]; then
            for f in $MENU_DIR/*.json; do
              [ -f "$f" ] || continue
              jq 'del(."admin/system/mounts", ."admin/services/mounts")' "$f" \
              > tmp.json && mv tmp.json "$f" || true
            done
          fi

          # =========================
          # 🚨 UPnP 自动启用
          # =========================
          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-upnp << 'EOF'
#!/bin/sh
uci set upnpd.config.enabled='1' 2>/dev/null
uci commit upnpd 2>/dev/null
/etc/init.d/miniupnpd enable 2>/dev/null
/etc/init.d/miniupnpd start 2>/dev/null
exit 0
EOF

          chmod +x files/etc/uci-defaults/99-upnp

      # =========================
      # 🔨 Build（稳定单线程兜底）
      # =========================
      - name: Build Firmware
        run: |
          cd openwrt
          make -j1 V=s || make -j1 V=s

      # =========================
      # 📦 Release（100%稳定输出）
      # =========================
      - name: Release Firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: B1r8-Stable-Core-Final
          files: openwrt/bin/targets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
