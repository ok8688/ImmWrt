name: Build ImmWrt v3.33
on:
  workflow_dispatch:
  schedule:
    - cron: '26 19 * * 1' # UTC时间每周一19:26 (精准对应香港时间每周二凌晨03:26)
permissions:
  contents: write
  actions: write # 清理旧版本需要此权限
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Init Environment
        run: |
          sudo apt update
          # 满足底层编译环境的基础依赖，已包含 ccache
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget jq ccache

      - name: Clone Source
        run: |
          git clone -b v25.12.0-rc2 --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt

      # 🚀 工业级双轨缓存策略 1：源码下载缓存 (严格绑定 YAML 指纹)
      - name: Cache DL (Source Code)
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ${{ runner.os }}-dl-v333-${{ hashFiles('.github/workflows/*.yml') }}

      # 🚀 工业级双轨缓存策略 2：底层算力结晶 (采用前缀匹配，允许跨版本无限复用)
      - name: Cache CCache (Compiler Objects)
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: ${{ runner.os }}-ccache-v333-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-v333-

      - name: Feeds & Official Sources
        run: |
          cd openwrt
          
          # 清理 feeds 缓存，确保环境绝对纯净
          ./scripts/feeds clean
          
          ./scripts/feeds update -a
          
          rm -rf feeds/luci/applications/luci-app-fstab
          ./scripts/feeds uninstall luci-app-fstab || true
          
          ./scripts/feeds uninstall luci-app-passwall xray-core sing-box || true
          git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/openwrt-passwall-packages
          git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall.git package/openwrt-passwall
          ./scripts/feeds update -i
          ./scripts/feeds install -a

          # 极客微调：使用 $f.tmp 确保 JSON 清理过程绝对安全无竞争
          MENU_DIR="feeds/luci/modules/luci-mod-system/root/usr/share/luci/menu.d"
          if [ -d "$MENU_DIR" ]; then
            for f in $MENU_DIR/*.json; do
              [ -f "$f" ] || continue
              jq 'del(."admin/system/mounts", ."admin/services/mounts")' "$f" > "$f.tmp" && mv "$f.tmp" "$f" || true
            done
          fi

      - name: Hardened Config & Ultimate Injection
        run: |
          cd openwrt
          
          mkdir -p files/etc/sysctl.d
          cat > files/etc/sysctl.d/99-bbr.conf << 'EOF'
          net.core.default_qdisc=fq_codel
          net.ipv4.tcp_congestion_control=bbr
          net.ipv4.tcp_fastopen=3
          net.ipv4.tcp_mtu_probing=1
          net.ipv4.tcp_syncookies=1
          net.ipv4.tcp_fin_timeout=15
          EOF
          
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-init-settings << 'EOF'
          #!/bin/sh
          uci set luci.main.mediaurlbase='/luci-static/argon'
          uci commit luci
          [ -f /etc/init.d/upnpd ] && /etc/init.d/upnpd disable
          for conf in smartdns dhcp network passwall; do
            [ -f /etc/config/$conf ] && chmod 600 /etc/config/$conf
          done
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-init-settings
          
          rm -f .config
          {
            echo "CONFIG_TARGET_x86=y"
            echo "CONFIG_TARGET_x86_64=y"
            echo "CONFIG_TARGET_x86_64_DEVICE_generic=y"
            echo "CONFIG_CCACHE=y"  # 已激活内核级 ccache 开关
            echo "CONFIG_TARGET_ROOTFS_PARTSIZE=2048"
            echo "CONFIG_TARGET_ROOTFS_EXT4FS=y"
            
            echo "CONFIG_LUCI_LANG_zh-cn=y"
            echo "CONFIG_PACKAGE_luci-light=y"
            echo "CONFIG_PACKAGE_luci-theme-argon=y"
            echo "CONFIG_PACKAGE_luci-app-argon-config=y"
            echo "CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y"
            
            echo "CONFIG_PACKAGE_luci-app-passwall=y"
            echo "CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y"
            echo "CONFIG_PACKAGE_xray-core=y"
            echo "CONFIG_PACKAGE_sing-box=y"
            echo "CONFIG_PACKAGE_smartdns=y"
            echo "CONFIG_PACKAGE_luci-app-smartdns=y"
            echo "CONFIG_PACKAGE_luci-i18n-smartdns-zh-cn=y"
            
            echo "CONFIG_PACKAGE_luci-app-ddns=y"
            echo "CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y"
            echo "CONFIG_PACKAGE_ddns-scripts-cloudflare=y"
            echo "CONFIG_PACKAGE_luci-app-upnp=y"
            echo "CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y"
            
            echo "CONFIG_PACKAGE_luci-app-ttyd=y"
            echo "CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y"
            echo "CONFIG_PACKAGE_luci-app-advanced-reboot=y"
            echo "CONFIG_PACKAGE_luci-i18n-advanced-reboot-zh-cn=y"
            
            echo "CONFIG_PACKAGE_qemu-ga=y"
            echo "CONFIG_PACKAGE_htop=y"
            echo "CONFIG_PACKAGE_nano=y"
            echo "CONFIG_PACKAGE_unzip=y"
            echo "CONFIG_PACKAGE_curl=y"
            echo "CONFIG_PACKAGE_wget-ssl=y"
            
            echo "CONFIG_PACKAGE_kmod-tcp-bbr=y"
            echo "CONFIG_PACKAGE_kmod-sched-core=y"
            echo "CONFIG_PACKAGE_kmod-virtio-net=y"
            echo "CONFIG_PACKAGE_kmod-virtio-blk=y"
            echo "CONFIG_PACKAGE_kmod-nft-offload=y"
            echo "CONFIG_PACKAGE_firewall4=y"

            echo "CONFIG_PACKAGE_block-mount=n"
            echo "CONFIG_PACKAGE_luci-app-fstab=n"
          } >> .config
          
          make defconfig
          sed -i 's/CONFIG_PACKAGE_luci-app-fstab=y/# CONFIG_PACKAGE_luci-app-fstab is not set/g' .config

      - name: Build World
        run: |
          cd openwrt
          export FORCE_UNSAFE_CONFIGURE=1
          export CCACHE_DIR="$PWD/.ccache"  # 🎯 核心补丁：强制引导算力结晶落盘
          mkdir -p "$CCACHE_DIR"            # 🎯 防御性补丁：预建缓存目录，绝对防红字
          
          # 📊 仪表盘：编译前打印历史缓存状态
          echo "=== 编译前 CCache 状态 ==="
          ccache -s
          
          make download -j8 || make download -j2
          find dl -size -1024c -delete
          make download -j2
          
          make -j$(nproc) V=s || make -j$(nproc) V=s || make -j1 V=s
          
          # 📊 仪表盘：编译后打印战果
          echo "=== 编译后 CCache 战果 ==="
          ccache -s

      - name: Generate Release Tag
        id: tag
        run: |
          echo "release_tag=v3.33-$(date +"%Y%m%d-%H%M")" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ImmWrt v3.33
          body: |
            ### 🚀 v3.33 纯净稳定版
            - **彻底删除挂载点**：引入 JSON 级菜单切除手术，根除幽灵菜单。
            - **极致网络架构**：BBR + `fq_codel` + `tcp_fin_timeout=15` 防短连接堆积。
            - **极强流水线抗风险**：前置 `feeds clean`、下载防残包、多线程双重试机制已全线部署。
            - **极简底层裁剪**：拔除 `intel-microcode` 避免并发冲突，完美适配 PVE 纯虚拟化环境。
          files: |
            openwrt/bin/targets/x86/64/*combined*.img.gz
            openwrt/bin/targets/x86/64/sha256sums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 5
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
