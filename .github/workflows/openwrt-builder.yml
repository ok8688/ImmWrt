name: Build ImmWrt Enterprise Factory v3.18

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FEEDS_PARALLEL: 1

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # =============================================================
      # 🧱 1. 环境初始化与能力图谱声明 (L0: Immutable Layer)
      # =============================================================
      - name: Init & Deterministic Env
        run: |
          sudo apt update
          sudo apt install -y build-essential jq coreutils moreutils time
          
          # 🚨 核心能力图谱定义：用于产物一致性校验
          cat > $GITHUB_WORKSPACE/capability_graph.json << 'EOF'
          {
            "NETWORK_VIRTUALIZATION": { "mandatory_pkgs": ["kmod-virtio-net", "block-mount"] },
            "SECURITY_TUNNEL": { "mandatory_pkgs": ["luci-app-passwall", "xray-core", "sing-box"] },
            "DNS_REINFORCEMENT": { "mandatory_pkgs": ["smartdns", "luci-app-smartdns"] },
            "UX_LAYER": { "mandatory_pkgs": ["luci-theme-argon"] }
          }
          EOF

      # =============================================================
      # 📥 2. 源码 (锁定 v25.12.0-rc2) + Feeds 供应源锁定
      # =============================================================
      - name: Clone Source & Immutable Feeds Lock
        run: |
          # 🚨 核心修正：锁定 v25.12.0-rc2 标签
          git clone -b v25.12.0-rc2 --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt
          
          cd openwrt
          # 强制注入确定的 Feeds 配置，解决依赖漂移风险
          cat > feeds.conf.default << 'EOF'
          src-git packages https://github.com/immortalwrt/packages.git
          src-git luci https://github.com/immortalwrt/luci.git
          src-git routing https://github.com/immortalwrt/routing.git
          src-git telephony https://github.com/immortalwrt/telephony.git
          src-git passwall_pkgs https://github.com/itdog-info/openwrt-passwall-packages.git
          src-git passwall_luci https://github.com/itdog-info/openwrt-passwall.git
          EOF

      # =============================================================
      # 🔥 3. Feeds 稳定化同步与物理裁剪
      # =============================================================
      - name: Atomic Feeds Sync (Stable Mode)
        run: |
          cd openwrt
          
          # 清理残留索引以防止目录不一致错误
          rm -rf ./feeds ./package/feeds
          
          # 执行更新（含重试机制）
          ./scripts/feeds update -a || ./scripts/feeds update -a
          ./scripts/feeds update -i || true
          
          # 🚨 需求落实：物理切除挂载点 UI
          rm -rf feeds/luci/applications/luci-app-fstab || true
          
          # 执行安装
          ./scripts/feeds install -a || ./scripts/feeds install -a || {
            echo "❌ feeds install failed"
            exit 1
          }
          
          # 存证当前供应指纹
          ./scripts/feeds list -s > $GITHUB_WORKSPACE/feeds.provenance.lock

      # =============================================================
      # ⚙️ 4. 硬化配置与开机安全加固
      # =============================================================
      - name: Hardened Config & Security
        run: |
          cd openwrt
          mkdir -p files/etc/uci-defaults
          
          cat > files/etc/uci-defaults/99-init-settings << 'EOF'
          #!/bin/sh
          # 🚨 需求落实：Argon 预设
          uci set luci.main.mediaurlbase='/luci-static/argon'
          uci commit luci
          # 🚨 需求落实：UPnP 封印
          [ -f /etc/init.d/upnpd ] && /etc/init.d/upnpd disable
          # 🚨 需求落实：核心配置文件权限硬化 (600)
          [ -f /etc/config/smartdns ] && chmod 600 /etc/config/smartdns
          [ -f /etc/config/dhcp ] && chmod 600 /etc/config/dhcp
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-init-settings
          
          # 注入核心编译配置
          {
            echo "CONFIG_TARGET_x86=y"
            echo "CONFIG_TARGET_x86_64=y"
            echo "CONFIG_PACKAGE_luci-app-passwall=y"
            echo "CONFIG_PACKAGE_xray-core=y"
            echo "CONFIG_PACKAGE_sing-box=y"
            echo "CONFIG_PACKAGE_smartdns=y"
            echo "CONFIG_PACKAGE_luci-app-smartdns=y"
            echo "CONFIG_PACKAGE_luci-theme-argon=y"
            echo "CONFIG_PACKAGE_block-mount=y"
          } >> .config
          
          make defconfig

      # =============================================================
      # 🏗️ 5. 编译执行 (含 Go 组件保底策略)
      # =============================================================
      - name: Build World
        run: |
          cd openwrt
          export FORCE_UNSAFE_CONFIGURE=1
          
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          
          # 针对内存压力大的 Go 组件使用单线程保底
          make package/compile -j$(nproc) V=s || make package/compile -j1 V=s
          make package/install -j$(nproc)
          make target/install -j$(nproc)

      # =============================================================
      # 🚨 6. 产物真值校验与镜像完整性检测
      # =============================================================
      - name: Artifact Proof & Image Integrity
        run: |
          # 🚨 v3.15 核心逻辑：基于“产物即真值”进行校验
          find openwrt/bin/packages/ -name "Packages" -exec grep "^Package: " {} + \
            | sed 's/^Package: //' | sort -u > $GITHUB_WORKSPACE/artifact.tokens.txt
          
          # 补充物理 IPK 扫描以增强确定性
          find openwrt/bin/packages/ -name "*.ipk" -o -name "*.apk" \
            | xargs -n1 basename \
            | sed -E 's/_[0-9].*//' >> $GITHUB_WORKSPACE/artifact.tokens.txt
          
          sort -u $GITHUB_WORKSPACE/artifact.tokens.txt -o $GITHUB_WORKSPACE/artifact.tokens.txt
          
          # 契约比对
          jq -r '.[] | .mandatory_pkgs[]' $GITHUB_WORKSPACE/capability_graph.json \
            | sort -u > $GITHUB_WORKSPACE/required.tokens.txt
          
          comm -23 $GITHUB_WORKSPACE/required.tokens.txt $GITHUB_WORKSPACE/artifact.tokens.txt \
            > $GITHUB_WORKSPACE/missing.tokens.txt
          
          if [ -s $GITHUB_WORKSPACE/missing.tokens.txt ]; then
            echo "❌ CRITICAL: Capability Breach! Missing mandatory packages:"
            cat $GITHUB_WORKSPACE/missing.tokens.txt
            exit 1
          fi
          
          # 健壮的镜像真值校验
          FIRMWARE_COUNT=$(find openwrt/bin/targets -type f \( -name "*.img.gz" -o -name "*.gz" \) | wc -l)
          if [ "$FIRMWARE_COUNT" -eq 0 ]; then
            echo "❌ CRITICAL: NO FIRMWARE IMAGE FOUND"
            exit 1
          fi
          
          echo "✅ Final Verdict: Artifact proof verified and Image generated."

      # =============================================================
      # 📦 7. 发布与资产存证
      # =============================================================
      - name: Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ImmWrt-Factory-v3.18-${{ github.run_number }}
          files: |
            openwrt/bin/targets/x86/64/*.gz
            ${{ github.workspace }}/feeds.provenance.lock
            ${{ github.workspace }}/artifact.tokens.txt
