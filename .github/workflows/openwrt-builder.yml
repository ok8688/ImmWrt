name: Build ImmWrt Enterprise Factory v3.10

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FEEDS_PARALLEL: 1

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # 護欄 3：Baseline 狀態與 Commit 真相鎖定
      - name: Checkout Baseline State & Pin Commit
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: baseline
          path: baseline-repo
          
      - name: Lock Baseline Commit
        run: |
          if [ -d "baseline-repo/.git" ] && git -C baseline-repo rev-parse --verify HEAD >/dev/null 2>&1; then
            git -C baseline-repo rev-parse HEAD > $GITHUB_WORKSPACE/baseline.commit.lock
            echo "🔒 Baseline locked at commit: $(cat $GITHUB_WORKSPACE/baseline.commit.lock)"
          else
            echo "⚠️ No valid baseline found. Initializing snapshot mode."
          fi

      # =============================================================
      # 🧱 1. L0: 能力語義契約聲明 (Package Semantic Layer)
      # =============================================================
      - name: Init & Define Semantic Contract
        run: |
          export DEBIAN_FRONTEND=noninteractive
          export TERM=dumb
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget jq time coreutils
          
          # 🚨 v3.10 核心：改為語義化契約，不再強綁定精確包名
          # 格式：[語義標籤]|[包名關鍵字]
          cat > $GITHUB_WORKSPACE/semantic.contract.txt << 'EOF'
          PASSWALL|passwall
          XRAY|xray-core
          SINGBOX|sing-box
          SMARTDNS|smartdns
          ARGON|theme-argon
          MOUNT|block-mount
          EOF
          
          echo "{\"build_time\":\"$(date -Iseconds)\",\"runner\":\"$RUNNER_NAME\"}" > $GITHUB_WORKSPACE/provenance.json

      - name: Clone Source
        run: |
          git clone -b v25.12.0-rc2 --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt

      # =============================================================
      # 🔥 2. Feeds 供應鏈審計
      # =============================================================
      - name: Feeds Supply Chain Audit
        run: |
          cd openwrt
          git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/openwrt-passwall-packages
          git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall.git package/openwrt-passwall
          ./scripts/feeds update -a
          rm -rf feeds/luci/applications/luci-app-fstab
          rm -rf feeds/luci/applications/luci-app-passwall
          rm -rf feeds/packages/net/passwall
          rm -rf feeds/packages/net/xray-core
          rm -rf feeds/packages/net/sing-box
          rm -rf feeds/packages/net/shadowsocksr-libev
          find package -type d -iname "*shadowsocksr*" -exec rm -rf {} +
          rm -f feeds/luci.index feeds/packages.index
          ./scripts/feeds update -a
          ./scripts/feeds update -i
          ./scripts/feeds install -a

      # =============================================================
      # ⚙️ 3. 配置引擎 & 開機加固 (chmod 600)
      # =============================================================
      - name: Dependency DAG & Baseline Guard
        run: |
          cd openwrt
          rm -f .config
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-init-settings << 'EOF'
          #!/bin/sh
          uci set luci.main.mediaurlbase='/luci-static/argon'
          uci set luci.main.mediaurlbase_theme='argon'
          uci commit luci
          [ -f /etc/init.d/upnpd ] && /etc/init.d/upnpd disable && uci set upnpd.config.enabled='0'
          [ -f /etc/config/smartdns ] && chmod 600 /etc/config/smartdns
          [ -f /etc/config/dhcp ] && chmod 600 /etc/config/dhcp
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-init-settings
          
          {
            echo "CONFIG_TARGET_x86=y"
            echo "CONFIG_TARGET_x86_64=y"
            echo "CONFIG_TARGET_x86_64_DEVICE_generic=y"
            echo "CONFIG_TARGET_ROOTFS_PARTSIZE=2048"
            echo "CONFIG_PACKAGE_luci-app-passwall=y"
            echo "CONFIG_PACKAGE_xray-core=y"
            echo "CONFIG_PACKAGE_sing-box=y"
            echo "CONFIG_PACKAGE_smartdns=y"
            echo "CONFIG_PACKAGE_luci-app-smartdns=y"
            echo "CONFIG_PACKAGE_luci-theme-argon=y"
            echo "CONFIG_PACKAGE_block-mount=y"
          } >> .config
          
          make defconfig
          ./scripts/dump-target-info.pl package | sort > $GITHUB_WORKSPACE/pkg.graph.current
          sha256sum $GITHUB_WORKSPACE/pkg.graph.current > $GITHUB_WORKSPACE/pkg.graph.lock
          
          # 護欄：如果 baseline 不存在則初始化
          if [ ! -f "baseline-repo/pkg.graph.lock" ]; then
            echo "⚠️ Missing baseline graph, initializing snapshot mode"
            mkdir -p baseline-repo
            cp $GITHUB_WORKSPACE/pkg.graph.lock baseline-repo/pkg.graph.lock
          fi

          if [ -f "$GITHUB_WORKSPACE/baseline.commit.lock" ]; then
            cmp -s "$GITHUB_WORKSPACE/pkg.graph.lock" "baseline-repo/pkg.graph.lock" || { echo "❌ Drift detected"; exit 1; }
          fi

      # =============================================================
      # 🏗️ 4. 雙流採集編譯 (Event Stream Layer)
      # =============================================================
      - name: Build World & Dual-Stream Collection
        run: |
          cd openwrt
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          make target/compile -j$(nproc)
          
          export FORCE_UNSAFE_CONFIGURE=1
          export TERM=dumb
          # 🚨 v3.10 雙流採集：完整記錄 + 實時過濾
          make package/compile -j$(nproc) V=s 2>&1 | tee $GITHUB_WORKSPACE/build.raw.log | stdbuf -oL grep -E "Installing|Package|Installing to" | tee $GITHUB_WORKSPACE/build.event.log
          
          make package/install -j$(nproc)
          make target/install -j$(nproc)
          make checksum

      # =============================================================
      # 🚨 5. 語義契約校驗 (Semantic Verdict Engine)
      # =============================================================
      - name: Semantic Verdict Engine
        run: |
          # 從雙流日誌中提取所有涉及的包特徵
          grep -oE "(Installing|Package) [a-zA-Z0-9_-]+" $GITHUB_WORKSPACE/build.raw.log \
            | awk '{print $2}' | sort -u > $GITHUB_WORKSPACE/installed.tokens.txt
          
          # 逐條語義校驗
          while IFS='|' read -r label keyword; do
            if ! grep -qi "$keyword" $GITHUB_WORKSPACE/installed.tokens.txt; then
              echo "❌ BREACH: Capability [$label] (Keyword: $keyword) NOT found in event stream!"
              exit 1
            fi
            echo "✅ FULFILLED: Capability [$label] confirmed."
          done < $GITHUB_WORKSPACE/semantic.contract.txt
          
          echo "✅ All Semantic Contracts Fulfilled."
          cd openwrt
          find . -type f -name "*.ko" -o -name "*.o" | sort | xargs sha256sum > $GITHUB_WORKSPACE/build.artifact.hash
          sha256sum bin/targets/*/*/*.gz > $GITHUB_WORKSPACE/firmware.sha256

      # =============================================================
      # 📦 6. 數字簽名 & 發布
      # =============================================================
      - name: Install Cosign & Release
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign & Upload
        run: |
          cosign sign-blob --yes --bundle $GITHUB_WORKSPACE/firmware.sha256.bundle $GITHUB_WORKSPACE/firmware.sha256
          
      - name: Release Factory Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ImmWrt-Factory-v3.10-${{ github.run_number }}
          files: |
            openwrt/bin/targets/x86/64/*.gz
            ${{ github.workspace }}/firmware.sha256
            ${{ github.workspace }}/build.raw.log
            ${{ github.workspace }}/pkg.graph.lock
