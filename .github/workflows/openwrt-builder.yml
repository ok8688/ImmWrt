name: Build ImmWrt Enterprise Factory v3.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FEEDS_PARALLEL: 1
    
    steps:
      - uses: actions/checkout@v4

      # =============================================================
      # 🧱 1. 环境指纹与元数据初始化
      # =============================================================
      - name: Init & SLSA Metadata
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget jq time
          
          # 锁定编译器版本，防止 Runner 环境更新导致的 ABI 漂移
          {
            echo "gcc=$(gcc -dumpversion)"
            echo "clang=$(clang --version | head -n1)"
          } > $GITHUB_WORKSPACE/toolchain.lock
          
          echo "{\"build_time\":\"$(date -Iseconds)\",\"runner\":\"$RUNNER_NAME\",\"os\":\"$ImageOS\",\"kernel\":\"$(uname -r)\"}" > $GITHUB_WORKSPACE/provenance.json

      - name: Clone Source
        run: |
          git clone -b v25.12.0-rc2 --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt

      # =============================================================
      # 🔥 2. Feeds 来源审计与 JSON 注入 (SLSA 核心)
      # =============================================================
      - name: Feeds Supply Chain Audit
        run: |
          cd openwrt
          
          touch $GITHUB_WORKSPACE/feeds.provenance.log
          
          git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/openwrt-passwall-packages
          git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall.git package/openwrt-passwall
          
          ./scripts/feeds update -a
          
          # 物理隔离与冲突切除
          rm -rf feeds/luci/applications/luci-app-passwall feeds/packages/net/passwall feeds/packages/net/xray-core feeds/packages/net/sing-box feeds/luci/applications/luci-app-fstab feeds/packages/net/shadowsocksr-libev
          find package -type d -iname "*shadowsocksr*" -exec rm -rf {} +
          
          # 稳健的 JSON 处理，防止 feeds list 过长导致参数截断
          jq empty $GITHUB_WORKSPACE/provenance.json
          ./scripts/feeds list -s > feeds.summary.txt
          jq -n \
            --slurpfile base $GITHUB_WORKSPACE/provenance.json \
            --rawfile feeds feeds.summary.txt \
            '$base[0] + {feeds_summary: $feeds}' \
            > provenance.json.tmp
          mv provenance.json.tmp $GITHUB_WORKSPACE/provenance.json
          
          # 强制排序，确保审计日志的顺序可复现
          for d in $(ls -d feeds/* | sort); do
            if [ -d "$d/.git" ]; then
              echo "{\"feed\": \"$d\", \"url\": \"$(git -C $d remote get-url origin)\", \"commit\": \"$(git -C $d rev-parse HEAD)\"}" >> $GITHUB_WORKSPACE/feeds.provenance.log
            fi
          done
          
          ./scripts/feeds install -a
          git rev-parse HEAD > $GITHUB_WORKSPACE/build.commit

      # =============================================================
      # ⚙️ 3. 配置引擎与 ABI 保护
      # =============================================================
      - name: Dependency DAG Engine
        run: |
          cd openwrt
          rm -f .config
          
          {
            echo "CONFIG_TARGET_x86=y"
            echo "CONFIG_TARGET_x86_64=y"
            echo "CONFIG_TARGET_x86_64_DEVICE_generic=y"
            echo "CONFIG_TARGET_ROOTFS_PARTSIZE=2048"
            echo "CONFIG_TARGET_ROOTFS_EXT4FS=y"
            echo "CONFIG_TARGET_ROOTFS_SQUASHFS=n"
            echo "CONFIG_PACKAGE_luci-app-passwall=y"
            echo "CONFIG_PACKAGE_xray-core=y"
            echo "CONFIG_PACKAGE_sing-box=y"
            echo "CONFIG_PACKAGE_shadowsocksr-libev=n"
            echo "CONFIG_PACKAGE_smartdns=y"
            echo "CONFIG_PACKAGE_kmod-virtio-net=y"
            echo "CONFIG_PACKAGE_qemu-ga=y"
          } >> .config
          
          make defconfig
          # 语义化依赖锁
          ./scripts/diffconfig.sh > $GITHUB_WORKSPACE/diffconfig.lock
          date +%s > $GITHUB_WORKSPACE/cache.version

      - name: Cache Matrix
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir/host*
            openwrt/staging_dir/toolchain-*
          key: factory-v3.2-${{ runner.os }}-${{ hashFiles('**/build.commit', '**/diffconfig.lock', '**/toolchain.lock', '**/cache.version') }}
          restore-keys: |
            factory-v3.2-${{ runner.os }}-${{ hashFiles('**/build.commit', '**/diffconfig.lock') }}
            factory-v3.2-${{ runner.os }}-

      # =============================================================
      # 🏗️ 4. 分层构建与产物校验 (Factory World)
      # =============================================================
      - name: Build World (Sequential)
        run: |
          cd openwrt
          echo "MAKE_JOBS=$(nproc)" >> $GITHUB_ENV
          
          # 第一阶段：基础工具
          make tools/install -j$(nproc) || make tools/install -j1 V=s
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s
          
          # 第二阶段：内核与符号审计
          make target/compile -j$(nproc) || make target/compile -j1 V=s
          
          if [ -f build_dir/target-*/linux-*/vmlinux ]; then
            readelf -Ws build_dir/target-*/linux-*/vmlinux | sha256sum > $GITHUB_WORKSPACE/kernel.symbol.lock
          else
            echo "NO_VMLINUX" | sha256sum > $GITHUB_WORKSPACE/kernel.symbol.lock
          fi
          
          # 第三阶段：包编译与封装
          make package/compile -j$(nproc) || make package/compile -j1 V=s
          make package/install -j$(nproc)
          make target/install -j$(nproc)
          make checksum
          
          # 产物完整性指纹
          find . -type f \( -name "*.o" -o -name "*.ko" \) | sort | xargs sha256sum > $GITHUB_WORKSPACE/build.artifact.hash
          sha256sum bin/targets/*/*/*.gz > $GITHUB_WORKSPACE/firmware.sha256

      # =============================================================
      # 📦 5. 自动化发布 (SLSA 分级分发)
      # =============================================================
      - name: Release Factory Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ImmWrt-Factory-v3.2-${{ github.run_number }}
          files: |
            openwrt/bin/targets/x86/64/*.gz
            ./*.sha256
            ./*.hash
            ./provenance.json
            ./feeds.provenance.log
            ./diffconfig.lock
            ./kernel.symbol.lock
            ./build.commit
            ./toolchain.lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
