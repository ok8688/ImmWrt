name: B1r8 Source Full 228 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 🧱 基础环境
      # =========================
      - name: Init Environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib gettext git libncurses5-dev libssl-dev python3 python3-distutils \
          rsync unzip zlib1g-dev file wget

      # =========================
      # 📥 Clone Source
      # =========================
      - name: Clone ImmortalWrt
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt

      # =========================
      # 📦 Feeds（关键：passwall 在这里）
      # =========================
      - name: Feeds Setup
        run: |
          cd openwrt

          echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall.git" >> feeds.conf.default
          echo "src-git smartdns https://github.com/pymumu/openwrt-smartdns.git" >> feeds.conf.default

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # =========================
      # ⚙️ Config（你的 228 体系核心）
      # =========================
      - name: Config Build
        run: |
          cd openwrt
          rm -f .config

          cat << 'EOF' >> .config
CONFIG_TARGET_x86=y
CONFIG_TARGET_x86_64=y
CONFIG_TARGET_x86_64_DEVICE_generic=y
CONFIG_TARGET_ROOTFS_PARTSIZE=2048

CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-theme-argon=y
CONFIG_PACKAGE_luci-app-argon-config=y

CONFIG_PACKAGE_dnsmasq-full=y
CONFIG_PACKAGE_dropbear=y
CONFIG_PACKAGE_firewall4=y
CONFIG_PACKAGE_fstools=y
CONFIG_PACKAGE_netifd=y
CONFIG_PACKAGE_nftables=y

CONFIG_PACKAGE_luci-app-upnp=y
CONFIG_PACKAGE_miniupnpd=y

CONFIG_PACKAGE_luci-app-ddns=y
CONFIG_PACKAGE_ddns-scripts-cloudflare=y

CONFIG_PACKAGE_luci-app-smartdns=y

CONFIG_PACKAGE_luci-app-ttyd=y

CONFIG_PACKAGE_luci-app-advanced-reboot=y

CONFIG_PACKAGE_luci-app-passwall=y

CONFIG_PACKAGE_htop=y
CONFIG_PACKAGE_nano=y
CONFIG_PACKAGE_curl=y
CONFIG_PACKAGE_wget-ssl=y

CONFIG_PACKAGE_kmod-button-hotplug=y
CONFIG_PACKAGE_kmod-fs-f2fs=y
CONFIG_PACKAGE_kmod-nft-offload=y

CONFIG_PACKAGE_qemu-ga=y

CONFIG_PACKAGE_intel-microcode=y

# Chinese UI
CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y
CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
CONFIG_PACKAGE_luci-i18n-smartdns-zh-cn=y
CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
CONFIG_PACKAGE_luci-i18n-advanced-reboot-zh-cn=y
CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y
EOF

          make defconfig

      # =========================
      # 🔥 Build（关键）
      # =========================
      - name: Build Firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s

      # =========================
      # 📊 输出大小
      # =========================
      - name: Show Size
        run: |
          ls -lah openwrt/bin/targets/** || true
          du -h openwrt/bin/targets/** || true

      # =========================
      # 📦 Artifact
      # =========================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: b1r8-full
          path: openwrt/bin/targets/**/*

      # =========================
      # 🚀 Release
      # =========================
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: B1r8-Full-228
          files: openwrt/bin/targets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
