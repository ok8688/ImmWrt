name: B1r8 Final Locked Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init Environment
        run: |
          sudo apt update
          sudo apt install -y build-essential git wget curl xz-utils

      - name: Download ImageBuilder
        run: |
          wget https://downloads.immortalwrt.org/releases/25.12.0/targets/x86/64/immortalwrt-imagebuilder-25.12.0-x86-64.Linux-x86_64.tar.xz
          tar -xf *.tar.xz
          mv immortalwrt-imagebuilder* builder

      - name: Build Firmware
        run: |
          cd builder

          make image PROFILE="generic" PACKAGES="apk-openssl base-files ca-bundle dnsmasq-full dropbear firewall4 fstools grub2-bios-setup kmod-button-hotplug kmod-fs-f2fs kmod-nft-offload libc libgcc libustream-openssl logd mkf2fs mtd netifd nftables odhcp6c odhcpd-ipv6only ppp ppp-mod-pppoe procd-ujail uci uclient-fetch urandom-seed urngd luci luci-i18n-base-zh-cn luci-i18n-opkg-zh-cn luci-i18n-firewall-zh-cn luci-theme-argon luci-app-argon-config luci-i18n-argon-config-zh-cn luci-app-passwall luci-i18n-passwall-zh-cn luci-app-smartdns luci-i18n-smartdns-zh-cn luci-app-ddns luci-i18n-ddns-zh-cn ddns-scripts-cloudflare luci-app-ttyd luci-i18n-ttyd-zh-cn luci-app-advanced-reboot luci-i18n-advanced-reboot-zh-cn luci-app-upnp luci-i18n-upnp-zh-cn qemu-ga htop nano unzip curl wget-ssl intel-microcode -automount -fdisk -parted -cfdisk -lsblk -losetup -partx-utils -resize2fs -e2fsprogs -kmod-fs-vfat -kmod-mmc -kmod-sdhci -kmod-usb-hid -kmod-usb-net -kmod-usb-net-asix -kmod-usb-net-asix-ax88179 -kmod-usb-net-rtl8150 -kmod-usb-net-rtl8152-vendor -kmod-vmxnet3 -kmod-e1000e -kmod-igbvf -kmod-igc -kmod-r8101 -kmod-r8125 -kmod-r8126 -kmod-r8168" FILES=../files

      - name: UPnP Enable
        run: |
          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-upnp << 'EOF'
#!/bin/sh
uci set upnpd.config.enabled='1'
uci commit upnpd
/etc/init.d/miniupnpd enable
exit 0
EOF

      - name: Show Size
        run: |
          echo "===== SIZE ====="
          du -h builder/bin/targets/** || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: b1r8
          path: builder/bin/targets/**/*

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: B1r8-Final
          files: builder/bin/targets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
