name: B1r8 v5 Stable Architecture

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 🧠 Environment
      # =========================
      - name: Init Environment
        run: |
          sudo apt update
          sudo apt install -y build-essential git wget libncurses5-dev libssl-dev python3-distutils jq

      # =========================
      # 📥 Clone
      # =========================
      - name: Clone OpenWrt
        run: |
          for i in 1 2 3; do
            git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt && break
            echo "retry $i"
            sleep 5
          done

      # =========================
      # 📦 Feeds
      # =========================
      - name: Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a || exit 1
          ./scripts/feeds install -a || exit 1

      # =========================
      # ⚙️ Config Base
      # =========================
      - name: Config Base
        run: |
          cd openwrt
          rm -f .config

          echo "CONFIG_TARGET_x86=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=2048" >> .config

          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config

          echo "CONFIG_PACKAGE_luci-app-upnp=y" >> .config
          echo "CONFIG_PACKAGE_miniupnpd=y" >> .config

          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
          echo "CONFIG_PACKAGE_smartdns=y" >> .config

          echo "CONFIG_PACKAGE_luci-app-ddns=y" >> .config
          echo "CONFIG_PACKAGE_ddns-scripts-cloudflare=y" >> .config

          echo "CONFIG_PACKAGE_luci-app-passwall=y" >> .config

          echo "CONFIG_PACKAGE_kmod-virtio-net=y" >> .config
          echo "CONFIG_PACKAGE_kmod-virtio-blk=y" >> .config

          echo "CONFIG_PACKAGE_kmod-nft-offload=y" >> .config
          echo "CONFIG_PACKAGE_kmod-nf-flow=y" >> .config

          make defconfig

      # =========================
      # 📦 DOWNLOAD
      # =========================
      - name: Download Packages
        run: |
          cd openwrt
          make download -j8  make download -j1 V=s  exit 1

      # =========================
      # 🧠 CLEAN
      # =========================
      - name: Clean Build Cache
        run: |
          cd openwrt
          rm -rf tmp || true
          rm -rf logs || true

      # =========================
      # 🧠 NETWORK ARCH OPTIMIZE（核心升级）
      # =========================
      - name: Network Architecture Optimize
        run: |
          cd openwrt

          # =========================
          # DNS 架构稳定化
          # =========================
          sed -i '/server=/d' package/network/services/dnsmasq/files/dhcp.conf || true
          echo "server=127.0.0.1#5335" >> package/network/services/dnsmasq/files/dhcp.conf

          # smartdns 避免冲突
          sed -i 's/enabled=1/enabled=1/g' feeds/luci/applications/luci-app-smartdns/root/etc/config/smartdns || true

          # =========================
          # Passwall 轻量优化
          # =========================
          sed -i 's/auto_switch=1/auto_switch=0/g' package/*/luci-app-passwall/root/etc/config/passwall || true

          # =========================
          # PVE / NAT 性能优化
          # =========================
          echo "net.netfilter.nf_conntrack_max=65536" >> package/base-files/files/etc/sysctl.conf
          echo "net.ipv4.tcp_fin_timeout=30" >> package/base-files/files/etc/sysctl.conf

      # =========================
      # 🔨 BUILD
      # =========================
      - name: Build Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      # =========================
      # 📦 RELEASE
      # =========================
