name: B1r8 Step-Up Stable Full

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # =========================
      # 🧠 基础环境
      # =========================
      - name: Init
        run: |
          sudo apt update
          sudo apt install -y build-essential git wget \
          libncurses5-dev libssl-dev python3-distutils jq

      # =========================
      # 📥 Clone（稳定源）
      # =========================
      - name: Clone OpenWrt
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt

      # =========================
      # 📦 Feeds（关键）
      # =========================
      - name: Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # =========================
      # ⚙️ Base Config（稳定内核）
      # =========================
      - name: Config Base
        run: |
          cd openwrt
          rm -f .config

          echo "CONFIG_TARGET_x86=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config

          # 📦 2GB rootfs
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=2048" >> .config

          make defconfig

      # =========================
      # 🧠 Stage 1：基础 LuCI
      # =========================
      - name: Stage 1 LuCI
        run: |
          cd openwrt

          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-light=y" >> .config

          make defconfig

      # =========================
      # 🎨 Stage 2：主题 + UI
      # =========================
      - name: Stage 2 UI
        run: |
          cd openwrt

          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config

          make defconfig

      # =========================
      # 🌐 Stage 3：网络基础服务
      # =========================
      - name: Stage 3 Network
        run: |
          cd openwrt

          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-upnp=y" >> .config
          echo "CONFIG_PACKAGE_miniupnpd=y" >> .config

          make defconfig

      # =========================
      # 🧠 Stage 4：高级功能（可选）
      # =========================
      - name: Stage 4 Advanced
        run: |
          cd openwrt

          echo "CONFIG_PACKAGE_luci-app-ddns=y" >> .config
          echo "CONFIG_PACKAGE_ddns-scripts-cloudflare=y" >> .config

          make defconfig

      # =========================
      # 🚀 Build（稳定模式）
      # =========================
      - name: Build Firmware
        run: |
          cd openwrt
          make -j1 V=s || make -j1

      # =========================
      # 📦 Release
      # =========================
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: B1r8-Step-Up
          files: openwrt/bin/targets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
