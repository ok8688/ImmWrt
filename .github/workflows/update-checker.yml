name: B1r8 Safe Fix Upgrade

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init Environment
        run: |
          sudo apt update
          sudo apt install -y build-essential git wget \
          libncurses5-dev libssl-dev python3-distutils jq

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # =========================
      # ⚙️ Config Base（保持你原版）
      # =========================
      - name: Config Base
        run: |
          cd openwrt
          rm -f .config

          echo "CONFIG_TARGET_x86=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config

          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=2048" >> .config

          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config

          echo "CONFIG_PACKAGE_luci-app-upnp=y" >> .config
          echo "CONFIG_PACKAGE_miniupnpd=y" >> .config

          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
          echo "CONFIG_PACKAGE_smartdns=y" >> .config

          echo "CONFIG_PACKAGE_luci-app-ddns=y" >> .config
          echo "CONFIG_PACKAGE_ddns-scripts-cloudflare=y" >> .config

          echo "CONFIG_PACKAGE_luci-app-passwall=y" >> .config

          echo "CONFIG_PACKAGE_kmod-virtio-net=y" >> .config
          echo "CONFIG_PACKAGE_kmod-virtio-blk=y" >> .config

          make defconfig

      # =========================
      # 🧠 Optimize Upgrade（核心升级）
      # =========================
      - name: Optimize Setup
        run: |
          cd openwrt

          # -------------------------
          # Argon（安全写法）
          # -------------------------
          sed -i "s/bootstrap/argon/g" \
          feeds/luci/modules/luci-base/root/etc/config/luci || true

          # -------------------------
          # flow offload
          # -------------------------
          sed -i '/flow_offloading/d' \
          package/network/config/firewall/files/firewall.config || true

          echo "option flow_offloading '1'" >> \
          package/network/config/firewall/files/firewall.config

          # ==================================================
          # 🚨 挂载点删除（稳定 jq 版 - 不会炸）
          # ==================================================
          MENU_DIR="feeds/luci/modules/luci-mod-system/root/usr/share/luci/menu.d"

          if [ -d "$MENU_DIR" ]; then
            for f in $MENU_DIR/*.json; do
              [ -f "$f" ] || continue
              jq 'del(."admin/system/mounts", ."admin/services/mounts")' "$f" \
              > tmp.json && mv tmp.json "$f" || true
            done
          fi

          # ==================================================
          # 🚨 UPnP 安全自启（带 fallback）
          # ==================================================
          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-upnp << 'EOF'
#!/bin/sh

# 可能存在/可能不存在 -> 全部容错
/etc/init.d/miniupnpd enable >/dev/null 2>&1 || true
/etc/init.d/miniupnpd start >/dev/null 2>&1 || true

uci set upnpd.config.enabled='1' >/dev/null 2>&1 || true
uci commit upnpd >/dev/null 2>&1 || true

exit 0
EOF

          chmod +x files/etc/uci-defaults/99-upnp

      # =========================
      # 🔨 Build
      # =========================
      - name: Build Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      # =========================
      # 📦 Release
      # =========================
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: B1r8-UPGRADE
          files: openwrt/bin/targets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
