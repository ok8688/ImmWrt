name: B1r8 Final Locked Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 🧱 环境（补 xz + 防 tar 红X）
      # =========================
      - name: Init Environment
        run: |
          sudo apt update
          sudo apt install -y build-essential git wget curl xz-utils ca-certificates

      # =========================
      # 🔍 DEBUG 1（解决你“全红”的关键）
      # =========================
      - name: DEBUG Network + Download
        run: |
          wget -O imagebuilder.tar.xz https://downloads.immortalwrt.org/releases/25.12.0/targets/x86/64/immortalwrt-imagebuilder-25.12.0-x86-64.Linux-x86_64.tar.xz
          ls -lh imagebuilder.tar.xz

      # =========================
      # 📦 解压（加错误检测）
      # =========================
      - name: Extract ImageBuilder
        run: |
          set -e
          tar -xf imagebuilder.tar.xz
          mv immortalwrt-imagebuilder* builder
          ls -lah builder

      # =========================
      # 🔥 Build（真正核心）
      # =========================
      - name: Build Firmware
        run: |
          set -e
          cd builder

          echo "=== START BUILD ==="

          make image PROFILE="generic" \
          PACKAGES="apk-openssl base-files ca-bundle dnsmasq-full dropbear firewall4 fstools grub2-bios-setup kmod-button-hotplug kmod-fs-f2fs kmod-nft-offload libc libgcc libustream-openssl logd mkf2fs mtd netifd nftables odhcp6c odhcpd-ipv6only ppp ppp-mod-pppoe procd-ujail uci uclient-fetch urandom-seed urngd luci luci-theme-argon luci-app-argon-config luci-app-passwall luci-app-smartdns luci-app-ddns luci-app-ttyd luci-app-advanced-reboot luci-app-upnp ddns-scripts-cloudflare htop nano unzip curl wget-ssl intel-microcode qemu-ga" \
          FILES=../files

      # =========================
      # ⚙️ UPnP（保持）
      # =========================
      - name: UPnP Enable
        run: |
          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-upnp << 'EOF'
#!/bin/sh
uci set upnpd.config.enabled='1'
uci commit upnpd
/etc/init.d/miniupnpd enable
exit 0
EOF

      # =========================
      # 📊 DEBUG 2（这一步能直接告诉你红X原因）
      # =========================
      - name: DEBUG Build Output
        run: |
          echo "===== TARGET DIR ====="
          ls -lah builder/bin/targets || true
          echo "===== SIZE ====="
          du -h builder/bin/targets || true

      # =========================
      # 📦 Artifact
      # =========================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: b1r8
          path: builder/bin/targets/**/*

      # =========================
      # 🚀 Release
      # =========================
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: B1r8-Final
          files: builder/bin/targets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
