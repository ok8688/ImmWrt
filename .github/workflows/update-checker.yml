name: B1r8 Final Locked Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 🧱 基础环境（最小稳定）
      # =========================
      - name: Init Environment
        run: |
          sudo apt update
          sudo apt install -y build-essential git wget curl xz-utils

      # =========================
      # 📥 固定 ImageBuilder（锁版本）
      # =========================
      - name: Download ImageBuilder
        run: |
          wget https://downloads.immortalwrt.org/releases/25.12.0/targets/x86/64/immortalwrt-imagebuilder-25.12.0-x86-64.Linux-x86_64.tar.xz
          tar -xf *.tar.xz
          mv immortalwrt-imagebuilder* builder

      # =========================
      # 🟢 固定包（你的 228 逻辑源）
      # =========================
      - name: Build Firmware
        run: |
          cd builder

          make image \
          PROFILE="generic" \
          PACKAGES="apk-openssl base-files ca-bundle dnsmasq-full dropbear firewall4 fstools grub2-bios-setup kmod-button-hotplug kmod-fs-f2fs kmod-nft-offload libc libgcc libustream-openssl logd mkf2fs mtd netifd nftables odhcp6c odhcpd-ipv6only ppp ppp-mod-pppoe procd-ujail uci uclient-fetch urandom-seed urngd \
          luci luci-light luci-theme-argon luci-app-argon-config \
          luci-app-passwall luci-app-smartdns luci-app-ddns luci-app-upnp luci-app-ttyd luci-app-advanced-reboot \
          luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn luci-i18n-opkg-zh-cn luci-i18n-passwall-zh-cn luci-i18n-smartdns-zh-cn luci-i18n-ddns-zh-cn luci-i18n-upnp-zh-cn luci-i18n-ttyd-zh-cn luci-i18n-advanced-reboot-zh-cn \
          ddns-scripts-cloudflare \
          htop nano curl wget-ssl \
          intel-microcode qemu-ga \
          " \
          FILES=../files

      # =========================
      # ⚙️ UPnP 自动启用（固定行为）
      # =========================
      - name: UPnP Enable
        run: |
          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-upnp << 'EOF'
#!/bin/sh
uci set upnpd.config.enabled='1'
uci commit upnpd
/etc/init.d/miniupnpd enable
exit 0
EOF

      # =========================
      # 📊 固件大小输出（你要的）
      # =========================
      - name: Show Firmware Info
        run: |
          echo "===== FILES ====="
          ls -lh builder/bin/targets/** || true

          echo ""
          echo "===== SIZE ====="
          du -h builder/bin/targets/** || true

      # =========================
      # 📦 Artifact（备用下载）
      # =========================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: b1r8-final
          path: builder/bin/targets/**/*

      # =========================
      # 🚀 Release（主下载入口）
      # =========================
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: B1r8-Final
          files: builder/bin/targets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
