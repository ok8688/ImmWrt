name: B1r8 Final Clean Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init Environment
        run: |
          sudo apt update
          sudo apt install -y build-essential git wget libncurses5-dev libssl-dev python3-distutils jq

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Config Base
        run: |
          cd openwrt
          rm -f .config

          # 架构 + 2GB
          echo "CONFIG_TARGET_x86=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=2048" >> .config

          # LuCI
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-light=y" >> .config

          # 主题
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-argon-config=y" >> .config

          # 终端
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config

          # UPnP
          echo "CONFIG_PACKAGE_luci-app-upnp=y" >> .config
          echo "CONFIG_PACKAGE_miniupnpd=y" >> .config

          # DNS
          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
          echo "CONFIG_PACKAGE_smartdns=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-smartdns=y" >> .config

          # DDNS
          echo "CONFIG_PACKAGE_luci-app-ddns=y" >> .config
          echo "CONFIG_PACKAGE_ddns-scripts-cloudflare=y" >> .config

          # Passwall
          echo "CONFIG_PACKAGE_luci-app-passwall=y" >> .config

          # 重启/关机
          echo "CONFIG_PACKAGE_luci-app-reboot=y" >> .config

          # 工具
          echo "CONFIG_PACKAGE_htop=y" >> .config
          echo "CONFIG_PACKAGE_curl=y" >> .config

          # PVE
          echo "CONFIG_PACKAGE_kmod-virtio-net=y" >> .config
          echo "CONFIG_PACKAGE_kmod-virtio-blk=y" >> .config

          # ❌ 删除挂载点
          echo "CONFIG_PACKAGE_luci-app-fstab=n" >> .config
          echo "CONFIG_PACKAGE_block-mount=n" >> .config
          echo "CONFIG_PACKAGE_blockd=n" >> .config

          make defconfig

      - name: Enable UPnP on boot
        run: |
          cd openwrt
          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-upnp << 'EOF'
#!/bin/sh
uci set upnpd.config.enabled='1' 2>/dev/null
uci commit upnpd 2>/dev/null
/etc/init.d/miniupnpd enable 2>/dev/null
exit 0
EOF

          chmod +x files/etc/uci-defaults/99-upnp

      - name: Build Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      # ✅ 修复：每次生成唯一 Release
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: B1r8-Final-${{ github.run_number }}
          files: openwrt/bin/targets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ✅ 保险下载（推荐保留）
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: openwrt/bin/targets/**/*
